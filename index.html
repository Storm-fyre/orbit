<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON LABS // Orbital Dynamics Studio</title>
  <style>
    :root {
      --bg-deep: #040509;
      --bg-panel: rgba(12, 15, 24, 0.94);
      --bg-card: rgba(22, 27, 42, 0.68);
      --border-glass: rgba(255, 255, 255, 0.09);
      --text-main: #f3f6ff;
      --text-muted: #8b95b0;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff2a85;
      --accent-gold: #ffbe0b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 35% 20%, #0f1528 0%, #040509 72%);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      touch-action: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Header - Flush Left & Right Alignment */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 16px;
      background: rgba(8, 10, 17, 0.9);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      letter-spacing: 0.9px;
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      box-shadow: 0 0 12px var(--accent-cyan);
      flex-shrink: 0;
    }

    .brand span {
      background: linear-gradient(90deg, #fff, #99e6ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    .icon-btn.active {
      background: rgba(255, 42, 133, 0.18);
      border-color: var(--accent-pink);
      color: #ff85b3;
    }

    /* Workspace */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .stage-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px 16px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(0, 240, 255, 0.03) 0%, transparent 70%);
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #030408;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 240, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Subtle Bottom Telemetry Hint */
    .telemetry-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 10, 18, 0.8);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 240, 255, 0.22);
      padding: 5px 13px;
      border-radius: 99px;
      font-size: 0.71rem;
      font-family: var(--font-mono);
      color: #b9c8e8;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
      letter-spacing: 0.3px;
    }

    .telemetry-hint strong {
      color: var(--accent-cyan);
    }

    /* Start Overlay */
    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 9, 0.62);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      cursor: pointer;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 20px;
      text-align: center;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-badge {
      padding: 15px 26px;
      border-radius: 99px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.18), rgba(255, 42, 133, 0.18));
      border: 1px solid rgba(0, 240, 255, 0.55);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 18px rgba(255, 42, 133, 0.15);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      animation: pulseBadge 1.8s infinite ease-in-out;
    }

    .start-sub {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 240, 255, 0.25); }
      50% { transform: scale(1.04); box-shadow: 0 0 45px rgba(255, 42, 133, 0.4); }
    }

    /* Control Sidebar */
    .control-panel {
      width: 300px;
      background: var(--bg-panel);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-glass);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 15;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.22), rgba(0, 140, 255, 0.2));
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .action-btn:hover {
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
    }

    .action-btn.secondary {
      border-color: rgba(255, 42, 133, 0.45);
      background: linear-gradient(135deg, rgba(255, 42, 133, 0.22), rgba(157, 78, 221, 0.2));
    }

    .action-btn.secondary.all-on {
      border-color: rgba(0, 240, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }

    .control-section {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 10px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--accent-cyan);
    }

    /* Toggle Switch Row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      color: #dce4f7;
    }

    .toggle-row:hover { color: #fff; }

    .switch {
      position: relative;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      transition: 0.22s;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #fff;
      border-radius: 50%;
      transition: 0.22s;
    }

    .switch input:checked + .slider-toggle {
      background: linear-gradient(135deg, var(--accent-cyan), #00a8ff);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .switch input:checked + .slider-toggle:before {
      transform: translateX(18px);
      background-color: #05070c;
    }

    /* 3 Single-Row Pill Buttons */
    .pill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 7px 6px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .pill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .pill-btn.active {
      background: rgba(0, 240, 255, 0.16);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    /* Mobile Portrait Responsive Layout */
    @media (max-width: 860px) {
      .top-bar { padding: 8px 12px; }
      .workspace { flex-direction: column; }
      .stage-container { flex: 1; padding: 6px 12px; }
      .control-panel {
        width: 100%;
        height: auto;
        border-left: none;
        border-top: 1px solid var(--border-glass);
        padding: 8px 12px 10px;
        gap: 6px;
      }
      .control-section {
        padding: 7px 11px;
        gap: 6px;
      }
      .action-btn {
        padding: 8px 10px;
      }
      .pill-btn {
        padding: 6px 4px;
      }
      .telemetry-hint {
        font-size: 0.64rem;
        padding: 4px 10px;
        bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Clean Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>NEON LABS</span>
      </div>

      <button class="icon-btn active" id="soundBtn">🔊 Audio: ON</button>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
      <div class="stage-container">
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="simCanvas"></canvas>

          <div class="telemetry-hint" id="telemetryHint">
            <strong>DRAG SPACE</strong> TO LAUNCH • <strong>GRAB ANY WORLD OR STAR</strong> TO MOVE
          </div>

          <!-- Tap Anywhere Overlay -->
          <div class="start-overlay" id="startOverlay">
            <div class="start-badge">🪐 Tap Anywhere to Start Orbital Lab</div>
            <div class="start-sub">Drag empty space to sling worlds, or grab any planet/star</div>
          </div>
        </div>
      </div>

      <!-- Compact Controls Sidebar -->
      <aside class="control-panel">
        <!-- Quick Actions at the Top -->
        <div class="btn-row">
          <button class="action-btn" id="resetSystemBtn">🔄 Restart</button>
          <button class="action-btn secondary" id="allTogglesBtn">🔥 All Toggles ON</button>
        </div>

        <!-- 3-Tier Launch Mass Selector -->
        <div class="control-section">
          <div class="section-label">Launch Mass (When Dragging Empty Space)</div>
          <div class="pill-grid" id="massSelectGroup">
            <button class="pill-btn" data-mass="moon">🌑 Moon</button>
            <button class="pill-btn active" data-mass="planet">🌍 Planet</button>
            <button class="pill-btn" data-mass="giant">🪐 Giant</button>
          </div>
        </div>

        <!-- 3 Core Lab Toggles -->
        <div class="control-section">
          <div class="section-label">Lab Rules</div>
          <label class="toggle-row">
            <span>🕸️ Spacetime Gravity Well</span>
            <div class="switch"><input type="checkbox" id="toggleGrid" checked /><span class="slider-toggle"></span></div>
          </label>
          <label class="toggle-row">
            <span>⏱️ Slow-Mo While Aiming</span>
            <div class="switch"><input type="checkbox" id="toggleSlowMo" checked /><span class="slider-toggle"></span></div>
          </label>
          <label class="toggle-row">
            <span>〰️ Long Spirograph Trails</span>
            <div class="switch"><input type="checkbox" id="toggleLongTrails" /><span class="slider-toggle"></span></div>
          </label>
        </div>

        <!-- 3 Distinct Star Systems -->
        <div class="control-section">
          <div class="section-label">Star System</div>
          <div class="pill-grid" id="systemPresetGroup">
            <button class="pill-btn active" data-system="solar">☀️ Solar</button>
            <button class="pill-btn" data-system="binary">♊ Binary</button>
            <button class="pill-btn" data-system="blackhole">🕳️ Singularity</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    /* 1. KEPLERIAN HARMONIC SPACE SYNTHESIZER */
    class CosmicAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastNoteTime = 0;
        this.scale = [196.00, 220.00, 246.94, 277.18, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33, 659.25, 739.99];
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      canPlay(gap = 45) {
        if (!this.enabled) return false;
        this.init();
        if (!this.ctx) return false;
        const now = performance.now();
        if (now - this.lastNoteTime < gap) return false;
        this.lastNoteTime = now;
        return true;
      }

      playOrbitalChime(speedRatio = 0.5) {
        if (!this.canPlay(55)) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const idx = Math.min(this.scale.length - 1, Math.max(0, Math.floor(speedRatio * this.scale.length)));
        osc.type = 'sine';
        osc.frequency.setValueAtTime(this.scale[idx], t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.08, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.4);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.42);
      }

      playLaunch() {
        if (!this.canPlay(40)) return;
        const t = this.ctx.currentTime;
        [293.66, 440.00, 587.33].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + i * 0.028);
          gain.gain.setValueAtTime(0.06, t + i * 0.028);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.028 + 0.32);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.028);
          osc.stop(t + i * 0.028 + 0.34);
        });
      }

      playTidalShred() {
        if (!this.canPlay(65)) return;
        const t = this.ctx.currentTime;
        [146.83, 220.00, 277.18, 369.99, 554.37].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.032);
          gain.gain.setValueAtTime(0.07, t + i * 0.032);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.032 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.032);
          osc.stop(t + i * 0.032 + 0.52);
        });
      }
    }

    const sfx = new CosmicAudio();
    let labStarted = false;

    function unlockLab() {
      if (labStarted) return;
      labStarted = true;
      sfx.init();
      document.getElementById('startOverlay').classList.add('hidden');
      sfx.playLaunch();
    }

    document.getElementById('startOverlay').addEventListener('pointerdown', e => {
      e.stopPropagation();
      unlockLab();
    });

    /* 2. VOLUMETRIC RENDERING & TRUE N-BODY ASTROPHYSICS ENGINE */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    let W = 800, H = 600, shake = 0;

    const labConfig = {
      showGrid: true,
      slowMoAim: true,
      longTrails: false,
      launchClass: 'planet', // 'moon' | 'planet' | 'giant'
      system: 'solar',
      G: 0.42
    };

    const massClasses = {
      moon:   { r: 4.5,  mass: 1.5,   hasRing: false, label: 'MOON' },
      planet: { r: 8.5,  mass: 22.0,  hasRing: false, label: 'PLANET' },
      giant:  { r: 14.0, mass: 175.0, hasRing: true,  label: 'GAS GIANT' }
    };

    const planetPalettes = [
      { name: 'Neptune Cyan', lit: '#72f6ff', mid: '#00a8ff', dark: '#04122c', atmo: 'rgba(0, 240, 255, 0.55)' },
      { name: 'Helios Gold',  lit: '#fff7cc', mid: '#ffbe0b', dark: '#2b1903', atmo: 'rgba(255, 190, 11, 0.55)' },
      { name: 'Super-Earth',  lit: '#a8ffdb', mid: '#00d68f', dark: '#04221b', atmo: 'rgba(0, 245, 155, 0.55)' },
      { name: 'Magenta Giant',lit: '#ffb8e6', mid: '#ff2a85', dark: '#29051a', atmo: 'rgba(255, 42, 133, 0.55)' },
      { name: 'Volcanic Io',  lit: '#fff099', mid: '#ff7b00', dark: '#280804', atmo: 'rgba(255, 136, 0, 0.55)' },
      { name: 'Amethyst Exo', lit: '#e5c2ff', mid: '#9d4edd', dark: '#1a062b', atmo: 'rgba(157, 78, 221, 0.55)' }
    ];

    let stars = [];
    let planets = [];
    let ringDebris = [];
    let bgStars = [];
    let interaction = null; // { mode: 'dragStar'|'slingExisting'|'slingNew', ... }

    function createBackgroundStars() {
      bgStars = [];
      for (let i = 0; i < 95; i++) {
        bgStars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.5 + Math.random() * 1.3,
          alpha: 0.15 + Math.random() * 0.55,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function spawnBody(x, y, vx, vy, r, mass, palette, hasRing = false) {
      const body = {
        x, y, vx, vy,
        r, mass,
        palette: palette || planetPalettes[Math.floor(Math.random() * planetPalettes.length)],
        hasRing,
        trail: [],
        prevDist: 99999,
        approaching: false,
        periapsisCooldown: 0,
        held: false
      };
      planets.push(body);
      return body;
    }

    function initSystem() {
      stars = [];
      planets = [];
      ringDebris = [];
      interaction = null;
      const cx = W / 2;
      const cy = H / 2;
      const minDim = Math.min(W, H);

      if (labConfig.system === 'solar') {
        const starMass = 2600;
        stars.push({
          x: cx, y: cy, vx: 0, vy: 0,
          mass: starMass, r: Math.max(20, minDim * 0.043),
          color: '#ffbe0b', core: '#ffffff', glow: '#ff6d00',
          type: 'star', relativity: 0,
          rocheRadius: Math.max(50, minDim * 0.105)
        });

        // 1. Inner Rocky Planet
        const r1 = minDim * 0.16;
        const v1 = Math.sqrt((labConfig.G * starMass) / r1);
        spawnBody(cx + r1, cy, 0, v1, 7.5, 18, planetPalettes[2], false);

        // 2. Massive Ringed Gas Giant + Its Own Orbiting Moon!
        const rGiant = minDim * 0.33;
        const vGiant = Math.sqrt((labConfig.G * starMass) / rGiant);
        const giantMass = 175;
        const gx = cx - rGiant;
        const gy = cy;
        spawnBody(gx, gy, 0, -vGiant, 14.0, giantMass, planetPalettes[1], true);

        // Place a Moon inside the Gas Giant's Hill Sphere
        const moonDist = 25;
        const vMoonRel = Math.sqrt((labConfig.G * giantMass) / Math.sqrt(moonDist * moonDist + 16));
        spawnBody(gx, gy - moonDist, vMoonRel, -vGiant, 4.3, 1.2, planetPalettes[0], false);

        // 3. Outer Ice World
        const r3 = minDim * 0.44;
        const v3 = Math.sqrt((labConfig.G * starMass) / r3);
        spawnBody(cx, cy - r3, v3, 0, 8.8, 25, planetPalettes[5], false);

      } else if (labConfig.system === 'binary') {
        const sep = minDim * 0.11;
        const starMass = 1500;
        const vOrb = Math.sqrt((labConfig.G * starMass) / (4 * sep));
        stars.push({
          x: cx - sep, y: cy, vx: 0, vy: -vOrb,
          mass: starMass, r: Math.max(15, minDim * 0.033),
          color: '#00f0ff', core: '#ffffff', glow: '#0077ff',
          type: 'star', relativity: 0,
          rocheRadius: Math.max(38, minDim * 0.08)
        });
        stars.push({
          x: cx + sep, y: cy, vx: 0, vy: vOrb,
          mass: starMass, r: Math.max(14, minDim * 0.031),
          color: '#ff2a85', core: '#ffffff', glow: '#ff0055',
          type: 'star', relativity: 0,
          rocheRadius: Math.max(36, minDim * 0.078)
        });

        [minDim * 0.27, minDim * 0.36, minDim * 0.44].forEach((orbitR, idx) => {
          const angle = idx * 2.1;
          const speed = Math.sqrt((labConfig.G * (starMass * 2)) / orbitR);
          const isGiant = idx === 1;
          spawnBody(
            cx + Math.cos(angle) * orbitR,
            cy + Math.sin(angle) * orbitR,
            -Math.sin(angle) * speed,
            Math.cos(angle) * speed,
            isGiant ? 13.0 : 8.2,
            isGiant ? 140 : 20,
            planetPalettes[(idx + 1) % planetPalettes.length],
            isGiant
          );
        });

      } else if (labConfig.system === 'blackhole') {
        // Supermassive Black Hole with Einstein Relativistic Precession
        const bhMass = 3600;
        stars.push({
          x: cx, y: cy, vx: 0, vy: 0,
          mass: bhMass, r: Math.max(21, minDim * 0.045),
          color: '#9d4edd', core: '#000000', glow: '#00f0ff',
          type: 'blackhole', relativity: 26, // Causes eccentric orbits to precess into rosettes!
          rocheRadius: Math.max(66, minDim * 0.14)
        });

        // Inner Relativistic Accretion Ring
        shredIntoRing(
          cx + minDim * 0.115, cy,
          0, Math.sqrt((labConfig.G * bhMass) / (minDim * 0.115)),
          planetPalettes[0], 65
        );

        // 3 Rosette-Precessing Worlds on Eccentric Orbits (120° apart)
        const apoapsis = minDim * 0.39;
        const vCirc = Math.sqrt((labConfig.G * bhMass) / apoapsis);
        const vEccentric = vCirc * 0.72; // Dives close to the photon ring and precesses!

        for (let i = 0; i < 3; i++) {
          const a = (i * Math.PI * 2) / 3 - Math.PI / 6;
          spawnBody(
            cx + Math.cos(a) * apoapsis,
            cy + Math.sin(a) * apoapsis,
            -Math.sin(a) * vEccentric,
            Math.cos(a) * vEccentric,
            8.5, 22,
            planetPalettes[i % planetPalettes.length],
            false
          );
        }
      }
    }

    function shredIntoRing(x, y, vx, vy, palette, count = 60) {
      if (ringDebris.length > 360) ringDebris.splice(0, count);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spread = Math.random() * 9;
        const dv = (Math.random() - 0.5) * 0.8;
        ringDebris.push({
          x: x + Math.cos(a) * spread,
          y: y + Math.sin(a) * spread,
          vx: vx + Math.cos(a) * dv * 0.6 - Math.sin(a) * dv,
          vy: vy + Math.sin(a) * dv * 0.6 + Math.cos(a) * dv,
          r: 1.2 + Math.random() * 1.5,
          color: Math.random() > 0.35 ? palette.lit : palette.mid,
          alpha: 0.65 + Math.random() * 0.35
        });
      }
    }

    /* 3. 3D-WARPED SPACETIME GRAVITY WELL GRID */
    function drawSpacetimeGrid() {
      if (!labConfig.showGrid) return;
      const step = Math.max(28, Math.floor(Math.min(W, H) / 16));
      const cols = Math.ceil(W / step) + 1;
      const rows = Math.ceil(H / step) + 1;

      function warpPoint(gx, gy) {
        let dxTotal = 0, dyTotal = 0;
        for (const s of stars) {
          const dx = s.x - gx;
          const dy = s.y - gy;
          const distSq = dx * dx + dy * dy + 2100;
          const dist = Math.sqrt(distSq);
          const pull = Math.min(step * 0.88, (s.mass * 14) / distSq);
          dxTotal += (dx / dist) * pull;
          dyTotal += (dy / dist) * pull;
        }
        for (const p of planets) {
          const dx = p.x - gx;
          const dy = p.y - gy;
          const distSq = dx * dx + dy * dy + 650;
          const dist = Math.sqrt(distSq);
          const pull = Math.min(step * 0.58, (p.mass * 5.2) / distSq);
          dxTotal += (dx / dist) * pull;
          dyTotal += (dy / dist) * pull;
        }
        return { x: gx + dxTotal, y: gy + dyTotal };
      }

      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.11)';

      for (let r = 0; r < rows; r++) {
        ctx.beginPath();
        for (let c = 0; c < cols; c++) {
          const pt = warpPoint(c * step, r * step);
          if (c === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }

      for (let c = 0; c < cols; c++) {
        ctx.beginPath();
        for (let r = 0; r < rows; r++) {
          const pt = warpPoint(c * step, r * step);
          if (r === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }

      // Subtle Roche limit warning rings around stars
      ctx.setLineDash([4, 6]);
      for (const s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.rocheRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 42, 133, 0.18)';
        ctx.stroke();
      }
      ctx.restore();
    }

    /* 4. VOLUMETRIC 3D SPHERE & STAR SHADERS */
    function drawStar(s, time) {
      ctx.save();
      const pulse = 1 + Math.sin(time * 0.003) * 0.05;

      if (s.type === 'blackhole') {
        const diskGrad = ctx.createRadialGradient(s.x, s.y, s.r * 0.9, s.x, s.y, s.r * 3.2 * pulse);
        diskGrad.addColorStop(0, '#ffffff');
        diskGrad.addColorStop(0.18, '#00f0ff');
        diskGrad.addColorStop(0.45, 'rgba(157, 78, 221, 0.55)');
        diskGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = diskGrad;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.2 * pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.55)';
        ctx.lineWidth = 2.2;
        for (let i = 0; i < 3; i++) {
          const a = time * 0.0028 + i * ((Math.PI * 2) / 3);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * (1.35 + i * 0.22), a, a + 1.5);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = '#020205';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      } else {
        const corona = ctx.createRadialGradient(s.x, s.y, s.r * 0.4, s.x, s.y, s.r * 3.0 * pulse);
        corona.addColorStop(0, s.core);
        corona.addColorStop(0.28, s.color);
        corona.addColorStop(0.6, s.glow + '44');
        corona.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = corona;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.0 * pulse, 0, Math.PI * 2);
        ctx.fill();

        const bodyGrad = ctx.createRadialGradient(
          s.x - s.r * 0.25, s.y - s.r * 0.25, s.r * 0.1,
          s.x, s.y, s.r
        );
        bodyGrad.addColorStop(0, '#ffffff');
        bodyGrad.addColorStop(0.55, s.color);
        bodyGrad.addColorStop(1, s.glow);

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = bodyGrad;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 22;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawVolumetricPlanet(p) {
      let lightStar = stars[0];
      if (stars.length > 1) {
        const d0 = Math.hypot(stars[0].x - p.x, stars[0].y - p.y);
        const d1 = Math.hypot(stars[1].x - p.x, stars[1].y - p.y);
        lightStar = d0 < d1 ? stars[0] : stars[1];
      }
      const lightAngle = lightStar ? Math.atan2(lightStar.y - p.y, lightStar.x - p.x) : -Math.PI / 4;
      const lx = Math.cos(lightAngle);
      const ly = Math.sin(lightAngle);

      ctx.save();

      if (p.hasRing) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.38);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 2.2, p.r * 0.6, 0, Math.PI, Math.PI * 2);
        ctx.strokeStyle = p.palette.lit + '88';
        ctx.lineWidth = Math.max(2, p.r * 0.25);
        ctx.stroke();
        ctx.restore();
      }

      const highlightX = p.x + lx * p.r * 0.45;
      const highlightY = p.y + ly * p.r * 0.45;
      const sphereGrad = ctx.createRadialGradient(
        highlightX, highlightY, p.r * 0.08,
        p.x - lx * p.r * 0.25, p.y - ly * p.r * 0.25, p.r * 1.18
      );
      sphereGrad.addColorStop(0, p.palette.lit);
      sphereGrad.addColorStop(0.46, p.palette.mid);
      sphereGrad.addColorStop(0.84, p.palette.dark);
      sphereGrad.addColorStop(1, '#020307');

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = sphereGrad;
      ctx.shadowColor = p.palette.atmo;
      ctx.shadowBlur = 12;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r - 0.5, lightAngle - 1.15, lightAngle + 1.15);
      ctx.strokeStyle = p.palette.lit;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (p.hasRing) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.38);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 2.2, p.r * 0.6, 0, 0, Math.PI);
        ctx.strokeStyle = p.palette.lit + 'cc';
        ctx.lineWidth = Math.max(2, p.r * 0.25);
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    /* 5. TRUE N-BODY PHYSICS ENGINE */
    function stepPhysics(dt) {
      if (!labStarted) return;

      // Bullet-Time Slow-Mo when aiming a world
      const isAiming = interaction && (interaction.mode === 'slingNew' || interaction.mode === 'slingExisting');
      const timeScale = (isAiming && labConfig.slowMoAim) ? 0.18 : 1.0;

      const subSteps = 4;
      const h = (dt * 0.85 * timeScale) / subSteps;

      for (let step = 0; step < subSteps; step++) {
        // 1. Binary Star Mutual Orbit (unless user is dragging a star)
        if (stars.length === 2) {
          const s0 = stars[0], s1 = stars[1];
          const dx = s1.x - s0.x;
          const dy = s1.y - s0.y;
          const distSq = dx * dx + dy * dy + 140;
          const dist = Math.sqrt(distSq);
          const f = (labConfig.G * s0.mass * s1.mass) / distSq;
          const fx = (dx / dist) * f;
          const fy = (dy / dist) * f;

          if (!s0.held) {
            s0.vx += (fx / s0.mass) * h;
            s0.vy += (fy / s0.mass) * h;
            s0.x += s0.vx * h;
            s0.y += s0.vy * h;
          }
          if (!s1.held) {
            s1.vx -= (fx / s1.mass) * h;
            s1.vy -= (fy / s1.mass) * h;
            s1.x += s1.vx * h;
            s1.y += s1.vy * h;
          }
        }

        // 2. N-Body Planet, Moon & Gas Giant Gravity
        const accX = new Float64Array(planets.length);
        const accY = new Float64Array(planets.length);

        for (let i = 0; i < planets.length; i++) {
          const p = planets[i];
          if (p.held) continue;

          // Star -> Planet Gravity (with Einstein relativistic precession if black hole)
          for (const s of stars) {
            const dx = s.x - p.x;
            const dy = s.y - p.y;
            const distSq = dx * dx + dy * dy + 55;
            const dist = Math.sqrt(distSq);
            const relBoost = s.relativity ? (1 + s.relativity / dist) : 1;
            const accel = ((labConfig.G * s.mass) / distSq) * relBoost;
            accX[i] += (dx / dist) * accel;
            accY[i] += (dy / dist) * accel;
          }

          // Planet <-> Planet Mutual N-Body Gravity
          for (let j = i + 1; j < planets.length; j++) {
            const other = planets[j];
            const dx = other.x - p.x;
            const dy = other.y - p.y;
            const distSq = dx * dx + dy * dy + 16;
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;

            if (!p.held) {
              const aP = (labConfig.G * other.mass) / distSq;
              accX[i] += nx * aP;
              accY[i] += ny * aP;
            }
            if (!other.held) {
              const aO = (labConfig.G * p.mass) / distSq;
              accX[j] -= nx * aO;
              accY[j] -= ny * aO;
            }
          }
        }

        // Integrate velocities, positions, mergers, and Roche shredding
        for (let i = planets.length - 1; i >= 0; i--) {
          const p = planets[i];
          if (p.held) continue;

          p.vx += accX[i] * h;
          p.vy += accY[i] * h;
          p.x += p.vx * h;
          p.y += p.vy * h;

          // Check Planet-Planet Mergers
          let merged = false;
          for (let j = i - 1; j >= 0; j--) {
            const other = planets[j];
            if (other.held) continue;
            const dist = Math.hypot(other.x - p.x, other.y - p.y);
            if (dist < (p.r + other.r) * 0.85) {
              const totalMass = p.mass + other.mass;
              const bigger = p.mass >= other.mass ? p : other;
              const smaller = p.mass < other.mass ? p : other;
              other.vx = (p.vx * p.mass + other.vx * other.mass) / totalMass;
              other.vy = (p.vy * p.mass + other.vy * other.mass) / totalMass;
              other.x = (p.x * p.mass + other.x * other.mass) / totalMass;
              other.y = (p.y * p.mass + other.y * other.mass) / totalMass;
              other.r = Math.min(20, Math.cbrt(Math.pow(p.r, 3) + Math.pow(other.r, 3)));
              other.mass = totalMass;
              other.palette = bigger.palette;
              if (totalMass > 60) other.hasRing = true;
              shredIntoRing(other.x, other.y, other.vx, other.vy, smaller.palette, 20);
              sfx.playTidalShred();
              shake = Math.min(7, shake + 3);
              planets.splice(i, 1);
              merged = true;
              break;
            }
          }
          if (merged) continue;

          // Check Star Roche Limit Shredding & Impacts
          let minStarDist = 99999;
          let closestStar = stars[0];
          for (const s of stars) {
            const d = Math.hypot(s.x - p.x, s.y - p.y);
            if (d < minStarDist) {
              minStarDist = d;
              closestStar = s;
            }
          }

          if (closestStar) {
            if (minStarDist < closestStar.r + p.r * 0.5) {
              shredIntoRing(p.x, p.y, p.vx * 0.4, p.vy * 0.4, p.palette, 28);
              sfx.playTidalShred();
              shake = Math.min(8, shake + 3.5);
              planets.splice(i, 1);
              continue;
            } else if (minStarDist < closestStar.rocheRadius && p.mass < 40) {
              // Moons and rocky planets shred into glowing Saturn-style rings inside the Roche limit
              shredIntoRing(p.x, p.y, p.vx, p.vy, p.palette, 58);
              sfx.playTidalShred();
              shake = Math.min(8, shake + 3.5);
              planets.splice(i, 1);
              continue;
            }
          }

          // Periapsis Chime
          if (p.periapsisCooldown > 0) p.periapsisCooldown -= h;
          if (minStarDist < p.prevDist) {
            p.approaching = true;
          } else if (p.approaching && minStarDist > p.prevDist) {
            p.approaching = false;
            if (p.periapsisCooldown <= 0 && minStarDist < Math.min(W, H) * 0.48) {
              const spd = Math.hypot(p.vx, p.vy);
              sfx.playOrbitalChime(Math.min(1, spd / 8.5));
              p.periapsisCooldown = 40;
            }
          }
          p.prevDist = minStarDist;

          if (p.x < -W || p.x > W * 2 || p.y < -H || p.y > H * 2) {
            planets.splice(i, 1);
          }
        }

        // 3. Update Debris Rings (pulled by both Stars and Heavy Gas Giants)
        for (let i = ringDebris.length - 1; i >= 0; i--) {
          const d = ringDebris[i];
          let ax = 0, ay = 0, swallowed = false;
          for (const s of stars) {
            const dx = s.x - d.x;
            const dy = s.y - d.y;
            const distSq = dx * dx + dy * dy + 35;
            const dist = Math.sqrt(distSq);
            if (dist < s.r * 0.92) {
              swallowed = true;
              break;
            }
            const relBoost = s.relativity ? (1 + s.relativity / dist) : 1;
            const accel = ((labConfig.G * s.mass) / distSq) * relBoost;
            ax += (dx / dist) * accel;
            ay += (dy / dist) * accel;
          }
          if (swallowed || d.x < -200 || d.x > W + 200 || d.y < -200 || d.y > H + 200) {
            ringDebris.splice(i, 1);
            continue;
          }
          d.vx += ax * h;
          d.vy += ay * h;
          d.x += d.vx * h;
          d.y += d.vy * h;
        }
      }

      // Record Orbital Trails
      const maxTrailLen = labConfig.longTrails ? 260 : 50;
      for (const p of planets) {
        if (p.held) continue;
        p.trail.push({ x: p.x, y: p.y });
        while (p.trail.length > maxTrailLen) p.trail.shift();
      }
    }

    function drawTrailsAndDebris() {
      ctx.save();
      ctx.lineCap = 'round';
      for (const p of planets) {
        if (p.trail.length < 2) continue;
        ctx.beginPath();
        for (let t = 0; t < p.trail.length; t++) {
          if (t === 0) ctx.moveTo(p.trail[t].x, p.trail[t].y);
          else ctx.lineTo(p.trail[t].x, p.trail[t].y);
        }
        ctx.strokeStyle = p.palette.mid;
        ctx.globalAlpha = labConfig.longTrails ? 0.52 : 0.35;
        ctx.lineWidth = Math.max(1.3, p.r * 0.25);
        ctx.stroke();
      }
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const d of ringDebris) {
        ctx.globalAlpha = d.alpha;
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    /* 6. FULL N-BODY LIVE HOLOGRAPHIC ORBIT PREDICTOR (NO SNAPPING) */
    function drawHolographicPredictor() {
      if (!interaction || interaction.mode === 'dragStar') return;

      const { startX, startY, vx, vy, r, mass, palette, hasRing, targetPlanet } = interaction;

      // Clone active Stars and Planets so moving Gas Giants & Binary Stars affect the prediction!
      const simStars = stars.map(s => ({ ...s }));
      const simPlanets = planets
        .filter(p => p !== targetPlanet)
        .map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, r: p.r, mass: p.mass }));

      let px = startX, py = startY, pvx = vx, pvy = vy;
      const path = [{ x: px, y: py }];
      let status = `${massClasses[labConfig.launchClass].label} // ELLIPTICAL ORBIT`;
      if (targetPlanet) status = 'REDIRECTING WORLD // LIVE N-BODY PATH';
      let pathColor = '#00f0ff';

      const h = 0.65;
      let minR = 99999, maxR = 0;

      for (let step = 0; step < 220; step++) {
        // Advance Binary Stars in prediction
        if (simStars.length === 2) {
          const s0 = simStars[0], s1 = simStars[1];
          const dx = s1.x - s0.x, dy = s1.y - s0.y;
          const distSq = dx * dx + dy * dy + 140;
          const dist = Math.sqrt(distSq);
          const f = (labConfig.G * s0.mass * s1.mass) / distSq;
          s0.vx += ((dx / dist) * f / s0.mass) * h;
          s0.vy += ((dy / dist) * f / s0.mass) * h;
          s1.vx -= ((dx / dist) * f / s1.mass) * h;
          s1.vy -= ((dy / dist) * f / s1.mass) * h;
          s0.x += s0.vx * h; s0.y += s0.vy * h;
          s1.x += s1.vx * h; s1.y += s1.vy * h;
        }

        // Advance other Planets in prediction
        for (const sp of simPlanets) {
          let sax = 0, say = 0;
          for (const s of simStars) {
            const dx = s.x - sp.x, dy = s.y - sp.y;
            const distSq = dx * dx + dy * dy + 55;
            const dist = Math.sqrt(distSq);
            const relBoost = s.relativity ? (1 + s.relativity / dist) : 1;
            const accel = ((labConfig.G * s.mass) / distSq) * relBoost;
            sax += (dx / dist) * accel;
            say += (dy / dist) * accel;
          }
          sp.vx += sax * h;
          sp.vy += say * h;
          sp.x += sp.vx * h;
          sp.y += sp.vy * h;
        }

        // Calculate acceleration on the aimed test world from Stars + Planets
        let ax = 0, ay = 0, hit = false;
        for (const s of simStars) {
          const dx = s.x - px, dy = s.y - py;
          const distSq = dx * dx + dy * dy + 55;
          const dist = Math.sqrt(distSq);
          if (dist < minR) minR = dist;
          if (dist > maxR) maxR = dist;

          if (dist < s.r + r * 0.5) {
            status = '⚠️ STELLAR IMPACT TRAJECTORY';
            pathColor = '#ff2a85';
            hit = true;
            break;
          }
          if (dist < s.rocheRadius && mass < 40) {
            status = '🪐 ROCHE LIMIT // TIDAL RING SHRED';
            pathColor = '#ffbe0b';
          }
          const relBoost = s.relativity ? (1 + s.relativity / dist) : 1;
          const accel = ((labConfig.G * s.mass) / distSq) * relBoost;
          ax += (dx / dist) * accel;
          ay += (dy / dist) * accel;
        }
        if (hit) break;

        for (const sp of simPlanets) {
          const dx = sp.x - px, dy = sp.y - py;
          const distSq = dx * dx + dy * dy + 16;
          const dist = Math.sqrt(distSq);
          if (dist < (sp.r + r) * 0.85) {
            status = '💥 PLANETARY MERGER COLLISION';
            pathColor = '#ff9933';
            hit = true;
            break;
          }
          const accel = (labConfig.G * sp.mass) / distSq;
          ax += (dx / dist) * accel;
          ay += (dy / dist) * accel;
        }
        if (hit) break;

        pvx += ax * h;
        pvy += ay * h;
        px += pvx * h;
        py += pvy * h;
        if (step % 2 === 0) path.push({ x: px, y: py });
      }

      document.getElementById('telemetryHint').innerHTML = `<strong>${status}</strong>`;

      ctx.save();
      // Draw Predicted Future N-Body Trajectory
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        if (i === 0) ctx.moveTo(path[i].x, path[i].y);
        else ctx.lineTo(path[i].x, path[i].y);
      }
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = pathColor;
      ctx.lineWidth = 2;
      ctx.shadowColor = pathColor;
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Raw Analog Launch Vector Line
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(interaction.curX, interaction.curY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // Draw Preview World if launching a new one
      if (interaction.mode === 'slingNew') {
        drawVolumetricPlanet({ x: startX, y: startY, r, palette, hasRing });
      }
      ctx.restore();
    }

    /* 7. POINTER INTERACTION: GRAB STARS, RE-SLING PLANETS, OR LAUNCH NEW */
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };
    }

    const VEL_SCALE = 0.068;

    canvas.addEventListener('pointerdown', e => {
      unlockLab();
      canvas.setPointerCapture(e.pointerId);
      const pt = getCanvasCoords(e);

      // 1. Check if user grabbed a Star or Black Hole
      for (const s of stars) {
        if (Math.hypot(pt.x - s.x, pt.y - s.y) <= s.r + 16) {
          s.held = true;
          interaction = {
            pointerId: e.pointerId,
            mode: 'dragStar',
            star: s
          };
          document.getElementById('telemetryHint').innerHTML =
            '<strong>DRAGGING GRAVITY CORE</strong> // WARPING SPACETIME IN REAL TIME';
          return;
        }
      }

      // 2. Check if user grabbed an existing Planet, Moon, or Gas Giant
      for (let i = planets.length - 1; i >= 0; i--) {
        const p = planets[i];
        if (Math.hypot(pt.x - p.x, pt.y - p.y) <= p.r + 18) {
          p.held = true;
          p.trail = [];
          interaction = {
            pointerId: e.pointerId,
            mode: 'slingExisting',
            targetPlanet: p,
            startX: p.x,
            startY: p.y,
            curX: p.x + p.vx / VEL_SCALE,
            curY: p.y + p.vy / VEL_SCALE,
            vx: p.vx,
            vy: p.vy,
            r: p.r,
            mass: p.mass,
            palette: p.palette,
            hasRing: p.hasRing
          };
          return;
        }
      }

      // 3. Otherwise, spawn & aim a new body of the selected Mass Class
      const spec = massClasses[labConfig.launchClass];
      const pal = planetPalettes[Math.floor(Math.random() * planetPalettes.length)];
      interaction = {
        pointerId: e.pointerId,
        mode: 'slingNew',
        targetPlanet: null,
        startX: pt.x,
        startY: pt.y,
        curX: pt.x,
        curY: pt.y,
        vx: 0,
        vy: 0,
        r: spec.r,
        mass: spec.mass,
        palette: pal,
        hasRing: spec.hasRing
      };
    });

    canvas.addEventListener('pointermove', e => {
      if (!interaction || e.pointerId !== interaction.pointerId) return;
      const pt = getCanvasCoords(e);

      if (interaction.mode === 'dragStar') {
        const s = interaction.star;
        s.vx = (pt.x - s.x) * 0.25;
        s.vy = (pt.y - s.y) * 0.25;
        s.x = pt.x;
        s.y = pt.y;
      } else {
        // 100% Un-snapped Analog Velocity Control
        interaction.curX = pt.x;
        interaction.curY = pt.y;
        interaction.vx = (pt.x - interaction.startX) * VEL_SCALE;
        interaction.vy = (pt.y - interaction.startY) * VEL_SCALE;
      }
    });

    function finishInteraction(e) {
      if (!interaction || e.pointerId !== interaction.pointerId) return;

      if (interaction.mode === 'dragStar') {
        interaction.star.held = false;
        if (stars.length === 1) {
          interaction.star.vx = 0;
          interaction.star.vy = 0;
        }
      } else if (interaction.mode === 'slingExisting') {
        const p = interaction.targetPlanet;
        p.vx = interaction.vx;
        p.vy = interaction.vy;
        p.held = false;
        sfx.playLaunch();
      } else if (interaction.mode === 'slingNew') {
        spawnBody(
          interaction.startX,
          interaction.startY,
          interaction.vx,
          interaction.vy,
          interaction.r,
          interaction.mass,
          interaction.palette,
          interaction.hasRing
        );
        sfx.playLaunch();
      }

      interaction = null;
      document.getElementById('telemetryHint').innerHTML =
        '<strong>DRAG SPACE</strong> TO LAUNCH • <strong>GRAB ANY WORLD OR STAR</strong> TO MOVE';
    }

    canvas.addEventListener('pointerup', finishInteraction);
    canvas.addEventListener('pointercancel', finishInteraction);

    /* 8. RESIZE, UI BINDINGS & MAIN LOOP */
    function resizeCanvas() {
      const rect = document.getElementById('canvasFrame').getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const newW = Math.max(260, Math.floor(rect.width));
      const newH = Math.max(260, Math.floor(rect.height));
      if (Math.abs(newW - W) < 4 && Math.abs(newH - H) < 4 && stars.length > 0) return;

      W = newW;
      H = newH;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createBackgroundStars();
      initSystem();
    }

    const resizeObserver = new ResizeObserver(() => resizeCanvas());
    resizeObserver.observe(document.getElementById('canvasFrame'));

    document.getElementById('soundBtn').addEventListener('click', e => {
      sfx.init();
      sfx.enabled = !sfx.enabled;
      e.target.classList.toggle('active', sfx.enabled);
      e.target.textContent = sfx.enabled ? '🔊 Audio: ON' : '🔇 Audio: OFF';
    });

    // Mass Class Selector (Moon | Planet | Giant)
    document.querySelectorAll('#massSelectGroup .pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#massSelectGroup .pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        labConfig.launchClass = btn.dataset.mass;
      });
    });

    // Dynamic "All Toggles ON" <-> "Default" Button
    const allTogglesBtn = document.getElementById('allTogglesBtn');

    function areAllTogglesOn() {
      return labConfig.showGrid && labConfig.slowMoAim && labConfig.longTrails;
    }

    function syncAllTogglesButton() {
      const allOn = areAllTogglesOn();
      allTogglesBtn.textContent = allOn ? '↺ Default' : '🔥 All Toggles ON';
      allTogglesBtn.classList.toggle('all-on', allOn);
    }

    document.getElementById('toggleGrid').addEventListener('change', e => {
      labConfig.showGrid = e.target.checked;
      syncAllTogglesButton();
    });
    document.getElementById('toggleSlowMo').addEventListener('change', e => {
      labConfig.slowMoAim = e.target.checked;
      syncAllTogglesButton();
    });
    document.getElementById('toggleLongTrails').addEventListener('change', e => {
      labConfig.longTrails = e.target.checked;
      if (!labConfig.longTrails) {
        planets.forEach(p => { if (p.trail.length > 50) p.trail.splice(0, p.trail.length - 50); });
      }
      syncAllTogglesButton();
    });

    allTogglesBtn.addEventListener('click', () => {
      if (areAllTogglesOn()) {
        // Return to ideal Default state (Grid ON, Slow-Mo ON, Long Spirograph Trails OFF)
        labConfig.showGrid = true;
        labConfig.slowMoAim = true;
        labConfig.longTrails = false;
      } else {
        labConfig.showGrid = true;
        labConfig.slowMoAim = true;
        labConfig.longTrails = true;
      }
      document.getElementById('toggleGrid').checked = labConfig.showGrid;
      document.getElementById('toggleSlowMo').checked = labConfig.slowMoAim;
      document.getElementById('toggleLongTrails').checked = labConfig.longTrails;
      syncAllTogglesButton();
      unlockLab();
    });

    // 3 Star System Presets
    document.querySelectorAll('#systemPresetGroup .pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#systemPresetGroup .pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        labConfig.system = btn.dataset.system;
        unlockLab();
        initSystem();
      });
    });

    document.getElementById('resetSystemBtn').addEventListener('click', () => {
      unlockLab();
      initSystem();
    });

    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const elapsed = now - lastFrameTime;
      lastFrameTime = now;
      const dt = Math.min(2.0, Math.max(0.5, elapsed / 16.667));

      ctx.save();
      ctx.fillStyle = '#030408';
      ctx.fillRect(0, 0, W, H);

      if (shake > 0.15) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= Math.pow(0.85, dt);
      } else {
        shake = 0;
      }

      // Deep Space Starfield
      ctx.fillStyle = '#ffffff';
      for (const st of bgStars) {
        ctx.globalAlpha = st.alpha * (0.75 + 0.25 * Math.sin(now * 0.002 + st.phase));
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawSpacetimeGrid();
      stepPhysics(dt);
      drawTrailsAndDebris();

      for (const s of stars) drawStar(s, now);
      for (const p of planets) drawVolumetricPlanet(p);

      drawHolographicPredictor();
      ctx.restore();
    }

    syncAllTogglesButton();
    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
