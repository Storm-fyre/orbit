<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
 <title>Astrodynamics &amp; Orbital Studio</title>
 <style>
  :root {
   --bg-deep: #030508;
   --bg-panel: rgba(10, 14, 22, 0.96);
   --bg-card: rgba(18, 24, 38, 0.74);
   --border-glass: rgba(148, 175, 215, 0.14);
   --text-main: #edf2ff;
   --text-muted: #7e8da8;
   --accent-cyan: #00e5ff;
   --accent-teal: #00f59b;
   --accent-amber: #ffaa00;
   --accent-crimson: #ff3366;
   --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
   --font-mono: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
  }

  * {
   box-sizing: border-box;
   margin: 0;
   padding: 0;
   -webkit-user-select: none;
   user-select: none;
   -webkit-tap-highlight-color: transparent;
  }

  html, body {
   width: 100%;
   height: 100%;
   background: radial-gradient(circle at 35% 20%, #0b1120 0%, #030508 75%);
   color: var(--text-main);
   font-family: var(--font-sans);
   overflow: hidden;
   touch-action: none;
  }

  .app-shell {
   display: flex;
   flex-direction: column;
   width: 100vw;
   height: 100vh;
   height: 100dvh;
   overflow: hidden;
  }

  /* Full-Height Workspace - Side-by-Side Laptop Layout */
  .workspace {
   display: flex;
   flex-direction: row;
   flex: 1;
   width: 100%;
   height: 100%;
   overflow: hidden;
   position: relative;
  }

  .stage-container {
   flex: 1;
   display: flex;
   align-items: center;
   justify-content: center;
   position: relative;
   padding: 10px 12px;
   overflow: hidden;
  }

  .canvas-frame {
   position: relative;
   width: 100%;
   height: 100%;
   border-radius: 12px;
   overflow: hidden;
   background: #020408;
   border: 1px solid rgba(148, 175, 215, 0.16);
   box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
   display: flex;
   align-items: center;
   justify-content: center;
   transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .canvas-frame.inspect-active {
   border-color: rgba(255, 170, 0, 0.65);
   box-shadow: 0 0 32px rgba(255, 170, 0, 0.15), inset 0 0 24px rgba(255, 170, 0, 0.08);
  }

  canvas {
   width: 100%;
   height: 100%;
   display: block;
   cursor: crosshair;
   touch-action: none;
  }

  .canvas-frame.inspect-active canvas {
   cursor: pointer;
  }

  /* Top Floating Inspector & Thruster Deck */
  .inspector-deck {
   position: absolute;
   top: 12px;
   left: 50%;
   transform: translateX(-50%);
   display: flex;
   align-items: center;
   gap: 8px;
   background: rgba(8, 13, 22, 0.92);
   -webkit-backdrop-filter: blur(12px);
   backdrop-filter: blur(12px);
   border: 1px solid rgba(255, 170, 0, 0.55);
   box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
   padding: 6px 12px;
   border-radius: 8px;
   z-index: 20;
   font-family: var(--font-mono);
   font-size: 0.68rem;
   white-space: nowrap;
   transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .inspector-deck.hidden {
   opacity: 0;
   pointer-events: none;
   transform: translateX(-50%) translateY(-8px);
  }

  .deck-tag {
   color: var(--accent-amber);
   font-weight: 700;
   letter-spacing: 0.7px;
   margin-right: 4px;
  }

  .deck-btn {
   background: rgba(255, 255, 255, 0.06);
   border: 1px solid rgba(148, 175, 215, 0.25);
   color: var(--text-main);
   padding: 5px 9px;
   border-radius: 5px;
   font-family: var(--font-mono);
   font-size: 0.65rem;
   font-weight: 600;
   letter-spacing: 0.4px;
   cursor: pointer;
   transition: all 0.15s ease;
  }

  .deck-btn:hover {
   border-color: var(--accent-cyan);
   background: rgba(0, 229, 255, 0.16);
   color: #fff;
  }

  .deck-btn.danger {
   border-color: rgba(255, 51, 102, 0.45);
   background: rgba(255, 51, 102, 0.14);
   color: #ff8da6;
  }

  .deck-btn.danger:hover {
   background: rgba(255, 51, 102, 0.28);
   color: #fff;
  }

  .deck-btn.exit-btn {
   border-color: rgba(255, 170, 0, 0.45);
   color: #ffd166;
  }

  /* Start Overlay */
  .start-overlay {
   position: absolute;
   inset: 0;
   background: rgba(3, 5, 9, 0.76);
   -webkit-backdrop-filter: blur(7px);
   backdrop-filter: blur(7px);
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   z-index: 30;
   cursor: pointer;
   transition: opacity 0.3s ease, visibility 0.3s ease;
   padding: 20px;
   text-align: center;
  }

  .start-overlay.hidden {
   opacity: 0;
   visibility: hidden;
   pointer-events: none;
  }

  .start-badge {
   padding: 14px 28px;
   border-radius: 6px;
   background: rgba(0, 229, 255, 0.1);
   border: 1px solid rgba(0, 229, 255, 0.55);
   box-shadow: 0 0 30px rgba(0, 229, 255, 0.18);
   color: #ffffff;
   font-family: var(--font-mono);
   font-weight: 700;
   font-size: 0.84rem;
   letter-spacing: 1.6px;
   text-transform: uppercase;
   animation: pulseFrame 2.2s infinite ease-in-out;
  }

  .start-platform-note {
   margin-top: 12px;
   padding: 5px 14px;
   border-radius: 4px;
   background: rgba(255, 170, 0, 0.1);
   border: 1px solid rgba(255, 170, 0, 0.4);
   color: #ffd166;
   font-family: var(--font-mono);
   font-weight: 700;
   font-size: 0.7rem;
   letter-spacing: 0.9px;
   text-transform: uppercase;
  }

  .start-sub {
   margin-top: 10px;
   font-size: 0.68rem;
   font-family: var(--font-mono);
   color: var(--text-muted);
   letter-spacing: 0.5px;
   line-height: 1.5;
  }

  @keyframes pulseFrame {
   0%, 100% { border-color: rgba(0, 229, 255, 0.45); box-shadow: 0 0 25px rgba(0, 229, 255, 0.15); }
   50% { border-color: rgba(0, 229, 255, 0.9); box-shadow: 0 0 38px rgba(0, 229, 255, 0.3); }
  }

  /* Control Sidebar */
  .control-panel {
   width: 305px;
   background: var(--bg-panel);
   -webkit-backdrop-filter: blur(20px);
   backdrop-filter: blur(20px);
   border-left: 1px solid var(--border-glass);
   padding: 12px 13px;
   display: flex;
   flex-direction: column;
   justify-content: space-between;
   gap: 8px;
   z-index: 15;
   overflow-y: auto;
   flex-shrink: 0;
  }

  .btn-row {
   display: flex;
   gap: 7px;
  }

  .util-btn {
   flex: 1;
   background: rgba(255, 255, 255, 0.04);
   border: 1px solid var(--border-glass);
   color: var(--text-muted);
   padding: 7px 8px;
   border-radius: 6px;
   font-size: 0.68rem;
   font-family: var(--font-mono);
   font-weight: 600;
   letter-spacing: 0.5px;
   cursor: pointer;
   transition: all 0.18s ease;
   white-space: nowrap;
   text-align: center;
  }

  .util-btn:hover {
   border-color: var(--accent-cyan);
   color: #fff;
  }

  .util-btn.active {
   background: rgba(0, 229, 255, 0.12);
   border-color: rgba(0, 229, 255, 0.45);
   color: var(--accent-cyan);
  }

  .action-btn {
   flex: 1;
   padding: 8px 8px;
   border-radius: 6px;
   border: 1px solid rgba(0, 229, 255, 0.4);
   background: rgba(0, 229, 255, 0.12);
   color: #fff;
   font-family: var(--font-mono);
   font-weight: 600;
   font-size: 0.68rem;
   letter-spacing: 0.5px;
   cursor: pointer;
   transition: all 0.18s ease;
   white-space: nowrap;
   text-transform: uppercase;
   text-align: center;
  }

  .action-btn:hover {
   background: rgba(0, 229, 255, 0.22);
   box-shadow: 0 0 14px rgba(0, 229, 255, 0.25);
  }

  /* Inspect Mode Button (Paired Next to Reset System) */
  .action-btn.inspect-btn {
   border-color: rgba(255, 170, 0, 0.45);
   background: rgba(255, 170, 0, 0.1);
   color: #ffd166;
  }

  .action-btn.inspect-btn:hover {
   background: rgba(255, 170, 0, 0.2);
   border-color: rgba(255, 170, 0, 0.8);
  }

  .action-btn.inspect-btn.active {
   background: rgba(255, 170, 0, 0.26);
   border-color: #ffaa00;
   color: #ffffff;
   box-shadow: 0 0 16px rgba(255, 170, 0, 0.35);
  }

  .control-section {
   background: var(--bg-card);
   border: 1px solid var(--border-glass);
   border-radius: 8px;
   padding: 9px 10px;
   display: flex;
   flex-direction: column;
   gap: 6px;
  }

  .section-label {
   font-size: 0.61rem;
   font-family: var(--font-mono);
   font-weight: 700;
   text-transform: uppercase;
   letter-spacing: 1.1px;
   color: var(--accent-cyan);
  }

  /* Toggle Switch Row */
  .toggle-row {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 10px;
   cursor: pointer;
   font-size: 0.72rem;
   font-weight: 500;
   color: #d0daee;
  }

  .toggle-row:hover { color: #fff; }

  .switch {
   position: relative;
   width: 34px;
   height: 17px;
   flex-shrink: 0;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .slider-toggle {
   position: absolute;
   cursor: pointer;
   inset: 0;
   background: rgba(255, 255, 255, 0.1);
   border-radius: 4px;
   transition: 0.2s;
   border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .slider-toggle:before {
   position: absolute;
   content: "";
   height: 11px;
   width: 11px;
   left: 2px;
   bottom: 2px;
   background-color: #8b9bb4;
   border-radius: 2px;
   transition: 0.2s;
  }

  .switch input:checked + .slider-toggle {
   background: rgba(0, 229, 255, 0.2);
   border-color: var(--accent-cyan);
  }

  .switch input:checked + .slider-toggle:before {
   transform: translateX(17px);
   background-color: var(--accent-cyan);
   box-shadow: 0 0 8px var(--accent-cyan);
  }

  /* Segmented Telemetry Buttons */
  .pill-grid {
   display: grid;
   grid-template-columns: repeat(3, 1fr);
   gap: 5px;
  }

  .pill-grid.cols-4 {
   grid-template-columns: repeat(4, 1fr);
  }

  .pill-btn {
   background: rgba(255, 255, 255, 0.03);
   border: 1px solid var(--border-glass);
   color: var(--text-muted);
   padding: 6px 3px;
   border-radius: 5px;
   font-size: 0.64rem;
   font-family: var(--font-mono);
   font-weight: 600;
   letter-spacing: 0.3px;
   cursor: pointer;
   text-align: center;
   transition: all 0.15s ease;
   white-space: nowrap;
   text-transform: uppercase;
  }

  .pill-btn:hover {
   color: #fff;
   background: rgba(255, 255, 255, 0.08);
  }

  .pill-btn.active {
   background: rgba(0, 229, 255, 0.14);
   border-color: var(--accent-cyan);
   color: #fff;
   box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.15);
  }

  .pill-btn.paused-play {
   background: rgba(0, 245, 155, 0.18);
   border-color: var(--accent-teal);
   color: var(--accent-teal);
   box-shadow: 0 0 12px rgba(0, 245, 155, 0.22);
  }

  /* Compact Landscape Tuning for Mobile Screens (Clears Top Status Bar Icons) */
  @media (max-height: 520px), (max-width: 920px) {
   .stage-container { padding: 6px 8px; }
   .control-panel {
    width: 252px;
    padding: 26px 9px 8px;
    gap: 5px;
   }
   .control-section {
    padding: 6px 8px;
    gap: 4px;
   }
   .util-btn, .action-btn { padding: 6px 5px; font-size: 0.62rem; }
   .pill-btn { padding: 5px 2px; font-size: 0.6rem; }
   .toggle-row { font-size: 0.67rem; }
   .inspector-deck { top: 10px; padding: 4px 8px; gap: 5px; }
   .deck-btn { padding: 4px 6px; font-size: 0.58rem; }
  }

  /* Hybrid Fallback: Force Horizontal Laptop View if Phone is Held Vertically */
  @media (orientation: portrait) and (max-width: 900px) {
   .app-shell {
    position: fixed;
    top: 0;
    left: 100vw;
    width: 100vh;
    width: 100dvh;
    height: 100vw;
    height: 100dvw;
    transform-origin: top left;
    transform: rotate(90deg);
   }
  }
 </style>
</head>
<body>
 <div class="app-shell" id="appShell">
  <!-- Full-Height Main Workspace -->
  <div class="workspace">
   <div class="stage-container">
    <div class="canvas-frame" id="canvasFrame">
     <canvas id="simCanvas"></canvas>

     <!-- Floating Inspector & Thruster Deck (Appears in Inspect Mode) -->
     <div class="inspector-deck hidden" id="inspectorDeck">
      <span class="deck-tag" id="deckTargetLabel">INSPECT MODE // TAP ANY BODY</span>
      <button class="deck-btn" id="btnPrograde" style="display:none;">▲ PROGRADE</button>
      <button class="deck-btn" id="btnRetrograde" style="display:none;">▼ RETROGRADE</button>
      <button class="deck-btn danger" id="btnDetonate" style="display:none;">✦ DETONATE</button>
      <button class="deck-btn exit-btn" id="btnExitInspect">✕ EXIT</button>
     </div>

     <!-- Tap Anywhere Start Overlay -->
     <div class="start-overlay" id="startOverlay">
      <div class="start-badge">INITIALIZE ORBITAL TELEMETRY</div>
      <div class="start-platform-note">THIS IS OPTIMISED FOR LAPTOP, BUT WORKS WITH MOBILE TOO</div>
      <div class="start-sub">
       TAP EMPTY SPACE: AUTO CIRCULAR ORBIT • DRAG: SLINGSHOT • GRAB BODY: REDIRECT
      </div>
     </div>
    </div>
   </div>

   <!-- Technical Controls Sidebar -->
   <aside class="control-panel">
    <!-- Row 1: Top Utility Row (Fullscreen Expand + Audio) -->
    <div class="btn-row">
     <button class="util-btn" id="fsBtn">⛶ EXPAND</button>
     <button class="util-btn active" id="soundBtn">AUDIO: ON</button>
    </div>

    <!-- Row 2: System Reset & Inspect Mode Toggle -->
    <div class="btn-row">
     <button class="action-btn" id="resetSystemBtn">RESET SYSTEM</button>
     <button class="action-btn inspect-btn" id="inspectModeBtn">🔍 INSPECT: OFF</button>
    </div>

    <!-- Time-Warp Integrator Controls (Dynamic PAUSE <-> PLAY) -->
    <div class="control-section">
     <div class="section-label">Time Warp // Integrator Rate</div>
     <div class="pill-grid cols-4" id="timeWarpGroup">
      <button class="pill-btn" id="pausePlayBtn" data-speed="0">PAUSE</button>
      <button class="pill-btn active" data-speed="1">1X</button>
      <button class="pill-btn" data-speed="2">2X</button>
      <button class="pill-btn" data-speed="4">4X</button>
     </div>
    </div>

    <!-- 4-Tier Payload Mass Selector (Including SWARM) -->
    <div class="control-section">
     <div class="section-label">Payload Mass Class</div>
     <div class="pill-grid cols-4" id="massSelectGroup">
      <button class="pill-btn" data-mass="moon">SAT</button>
      <button class="pill-btn active" data-mass="planet">TERR</button>
      <button class="pill-btn" data-mass="giant">JOVIAN</button>
      <button class="pill-btn" data-mass="swarm">SWARM</button>
     </div>
    </div>

    <!-- 3 Core Flight Computer Toggles -->
    <div class="control-section">
     <div class="section-label">Flight Computer &amp; Optics</div>
     <label class="toggle-row">
      <span>Deep-Range Orbit Predictor</span>
      <div class="switch"><input type="checkbox" id="toggleDeepPredict" checked /><span class="slider-toggle"></span></div>
     </label>
     <label class="toggle-row">
      <span>Time Dilation While Aiming</span>
      <div class="switch"><input type="checkbox" id="toggleSlowMo" checked /><span class="slider-toggle"></span></div>
     </label>
     <label class="toggle-row">
      <span>Persistent Precession Trails</span>
      <div class="switch"><input type="checkbox" id="toggleLongTrails" /><span class="slider-toggle"></span></div>
     </label>
    </div>

    <!-- 3 Distinct Gravitational Regimes -->
    <div class="control-section">
     <div class="section-label">Gravitational Regime</div>
     <div class="pill-grid" id="systemPresetGroup">
      <button class="pill-btn active" data-system="solar">SOLAR</button>
      <button class="pill-btn" data-system="binary">BINARY</button>
      <button class="pill-btn" data-system="blackhole">SINGULARITY</button>
     </div>
    </div>
   </aside>
  </div>
 </div>

 <script>
  /* 1. ACOUSTIC TELEMETRY SYNTHESIZER */
  class TelemetryAudio {
   constructor() {
    this.ctx = null;
    this.enabled = true;
    this.lastNoteTime = 0;
    this.scale = [196.00, 220.00, 246.94, 277.18, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33, 659.25, 739.99];
   }

   init() {
    if (!this.ctx) {
     const AudioCtx = window.AudioContext || window.webkitAudioContext;
     if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
     this.ctx.resume();
    }
   }

   canPlay(gap = 50) {
    if (!this.enabled) return false;
    this.init();
    if (!this.ctx) return false;
    const now = performance.now();
    if (now - this.lastNoteTime < gap) return false;
    this.lastNoteTime = now;
    return true;
   }

   playPeriapsisPing(speedRatio = 0.5) {
    if (!this.canPlay(65)) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    const idx = Math.min(this.scale.length - 1, Math.max(0, Math.floor(speedRatio * this.scale.length)));
    osc.type = 'sine';
    osc.frequency.setValueAtTime(this.scale[idx], t);

    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.065, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.36);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.38);
   }

   playInject() {
    if (!this.canPlay(40)) return;
    const t = this.ctx.currentTime;
    [329.63, 493.88, 659.25].forEach((freq, i) => {
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'triangle';
     osc.frequency.setValueAtTime(freq, t + i * 0.025);
     gain.gain.setValueAtTime(0.05, t + i * 0.025);
     gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.025 + 0.25);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start(t + i * 0.025);
     osc.stop(t + i * 0.025 + 0.26);
    });
   }

   playImpact() {
    if (!this.canPlay(65)) return;
    const t = this.ctx.currentTime;
    [146.83, 220.00, 293.66].forEach((freq, i) => {
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'sine';
     osc.frequency.setValueAtTime(freq, t + i * 0.03);
     gain.gain.setValueAtTime(0.07, t + i * 0.03);
     gain.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.03 + 0.42);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start(t + i * 0.03);
     osc.stop(t + i * 0.03 + 0.44);
    });
   }

   playIgnitionChord() {
    if (!this.canPlay(40)) return;
    const t = this.ctx.currentTime;
    [130.81, 196.00, 261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
     const osc = this.ctx.createOscillator();
     const gain = this.ctx.createGain();
     osc.type = 'triangle';
     osc.frequency.setValueAtTime(freq, t + i * 0.035);
     gain.gain.setValueAtTime(0.06, t + i * 0.035);
     gain.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.035 + 0.85);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start(t + i * 0.035);
     osc.stop(t + i * 0.035 + 0.88);
    });
   }

   playThruster() {
    if (!this.canPlay(35)) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(240, t + 0.14);
    gain.gain.setValueAtTime(0.045, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
   }
  }

  const sfx = new TelemetryAudio();
  let labStarted = false;

  async function engageLandscapeFullscreen() {
   try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
     await document.documentElement.requestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
     await screen.orientation.lock('landscape').catch(() => {});
    }
   } catch (_) {}
  }

  function unlockLab(tryMobileLandscape = false) {
   if (!labStarted) {
    labStarted = true;
    sfx.init();
    document.getElementById('startOverlay').classList.add('hidden');
    sfx.playInject();
   }
   if (tryMobileLandscape && window.innerWidth < 920 && 'ontouchstart' in window) {
    engageLandscapeFullscreen();
   }
  }

  document.getElementById('startOverlay').addEventListener('pointerdown', e => {
   e.stopPropagation();
   unlockLab(true);
  });

  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', async () => {
   unlockLab(false);
   if (!document.fullscreenElement) {
    await engageLandscapeFullscreen();
   } else if (document.exitFullscreen) {

  function createBackgroundStars() {
   bgStars = [];
   for (let i = 0; i < 110; i++) {
    bgStars.push({
     x: Math.random() * W,
     y: Math.random() * H,
     r: 0.4 + Math.random() * 1.1,

    });
   }
  }

  function softenedCircularSpeed(mass, dist, softSq) {
   return dist * Math.sqrt((labConfig.G * mass) / Math.pow(dist * dist + softSq, 1.5));
  }

  function getSystemBarycenter() {
   let totalM = 0, bx = W / 2, by = H / 2, bvx = 0, bvy = 0;
   if (stars.length > 0) {
    bx = 0; by = 0;
    for (const s of stars) {
     totalM += s.mass;
     bx += s.x * s.mass;
     by += s.y * s.mass;
     bvx += s.vx * s.mass;
     bvy += s.vy * s.mass;
    }
    bx /= totalM;
    by /= totalM;
    bvx /= totalM;
    bvy /= totalM;
   }
   return { x: bx, y: by, vx: bvx, vy: bvy, mass: totalM };
  }

  function computeAutoCircularVelocity(x, y, payloadMass) {
   for (const p of planets) {
    if (p.mass >= 80 && payloadMass < p.mass) {
     const dx = x - p.x;
     const dy = y - p.y;
     const d = Math.hypot(dx, dy);
     if (d > p.r + 4 && d < 68) {
      const spd = softenedCircularSpeed(p.mass + payloadMass, d, PLANET_SOFT);
      return {
       vx: p.vx - (dy / d) * spd,
       vy: p.vy + (dx / d) * spd
      };
     }
    }
   }

   const bary = getSystemBarycenter();
   const dx = x - bary.x;
   const dy = y - bary.y;
   const d = Math.max(8, Math.hypot(dx, dy));
   let spd = softenedCircularSpeed(bary.mass + payloadMass, d, STAR_SOFT);
   if (stars.length === 1 && stars[0].relativity) {
    const relBoost = Math.sqrt(1 + (stars[0].relativity * stars[0].r) / (d * d + STAR_SOFT));
    spd *= relBoost;
   }
   return {
    vx: bary.vx - (dy / d) * spd,
    vy: bary.vy + (dx / d) * spd
   };
  }

  function spawnPulseRing(x, y, startR, maxR, color = '#00e5ff', speed = 0.032) {
   pulseRings.push({ x, y, r: startR, maxR, color, life: 1.0, speed });
  }

  function spawnCallout(x, y, text, color = '#00f59b') {
   if (floatingCallouts.length > 10) floatingCallouts.shift();
   floatingCallouts.push({ x, y, text, color, life: 1.0 });
  }

  function spawnBody(x, y, vx, vy, r, mass, palette, hasRing = false, designation = null, silentPulse = false, swarmGrace = 0) {
   const prefix = mass >= 100 ? 'JOV' : (mass >= 10 ? 'TER' : (mass >= 1 ? 'SAT' : 'AST'));
   const code = designation || `${prefix}-${String(bodyCounter++).padStart(2, '0')}`;
   const body = {
    x, y, vx, vy,
    r, mass,
    code,
    palette: palette || celestialPalettes[Math.floor(Math.random() * celestialPalettes.length)],
    hasRing,
    trail: [],
    prevDist: 99999,
    approaching: false,
    periapsisCooldown: 0,
    slingshotCooldown: 0,
    swarmGrace,
    prevSpeed: Math.hypot(vx, vy),
    held: false
   };
   planets.push(body);
   if (!silentPulse) {
    spawnPulseRing(x, y, r, r + 22, body.palette.lit, 0.045);
   }
   return body;
  }

  // Spawns a 12-asteroid cluster that fans out into an orbital stream before accreting over 2.5 - 5 seconds
  function spawnSwarmCluster(cx, cy, baseVx, baseVy, sizeScale, palette) {
   const count = 12;
   const spec = massClasses.swarm;
   spawnPulseRing(cx, cy, 4, 34, '#00e5ff', 0.04);

   const baseSpd = Math.hypot(baseVx, baseVy);
   const tx = baseSpd > 0.05 ? (baseVx / baseSpd) : 1;
   const ty = baseSpd > 0.05 ? (baseVy / baseSpd) : 0;
   const nx = -ty;
   const ny = tx;

   for (let i = 0; i < count; i++) {
    const along = (i - (count - 1) / 2) * 3.8 + (Math.random() - 0.5) * 2.0;
    const across = (Math.random() - 0.5) * 14.0;
    const px = cx + tx * along + nx * across;
    const py = cy + ty * along + ny * across;

    // Slight orbital velocity dispersion so they stretch into a crescent before mutual gravity pulls them together
    const dvAlong = (i - (count - 1) / 2) * 0.018;
    const dvAcross = (Math.random() - 0.5) * 0.07;
    const pal = i % 2 === 0 ? palette : celestialPalettes[(i + 2) % celestialPalettes.length];

    // Staggered grace window (~1.8s to ~4.2s) so rocks collide in a multi-second mid-orbit chain reaction!
    const graceUnits = 95 + i * 11 + Math.random() * 18;
    spawnBody(
     px, py,
     baseVx + tx * dvAlong + nx * dvAcross,
     baseVy + ty * dvAlong + ny * dvAcross,
     spec.r * sizeScale * (0.85 + Math.random() * 0.3),
     spec.mass,
     pal,
     false,
     null,
     true,
     graceUnits
    );
   }
  }

  // True 3-Second Swirling Orbital Powder (180 frames at 60Hz)
  function spawnOrbitalPowder(x, y, vx, vy, palette, count = 65, hitStar = null) {
   if (impactDebris.length > 420) impactDebris.splice(0, count);

   for (let i = 0; i < count; i++) {
    let px = x, py = y, pvx = vx, pvy = vy;

    if (hitStar) {
     const impactAngle = Math.atan2(y - hitStar.y, x - hitStar.x);
     const spreadAngle = impactAngle + (Math.random() - 0.5) * 1.45;
     const surfaceR = hitStar.r + 2.5 + Math.random() * 10;
     px = hitStar.x + Math.cos(spreadAngle) * surfaceR;
     py = hitStar.y + Math.sin(spreadAngle) * surfaceR;

     const tx = -Math.sin(spreadAngle);
     const ty = Math.cos(spreadAngle);
     const rx = Math.cos(spreadAngle);
     const ry = Math.sin(spreadAngle);

     const tangDot = (vx - hitStar.vx) * tx + (vy - hitStar.vy) * ty;
     const spinSign = tangDot >= 0 ? 1 : -1;
     const orbSpeed = softenedCircularSpeed(hitStar.mass, surfaceR, STAR_SOFT) * (0.55 + Math.random() * 0.65);
     const outSpeed = 0.25 + Math.random() * 1.55;

     pvx = hitStar.vx + tx * spinSign * orbSpeed + rx * outSpeed;
     pvy = hitStar.vy + ty * spinSign * orbSpeed + ry * outSpeed;
    } else {
     const a = Math.random() * Math.PI * 2;
     const spread = Math.random() * 7;
     const dv = 0.18 + Math.random() * 1.35;
     px = x + Math.cos(a) * spread;
     py = y + Math.sin(a) * spread;
     pvx = vx * 0.72 + Math.cos(a) * dv;
     pvy = vy * 0.72 + Math.sin(a) * dv;
    }

    impactDebris.push({
     x: px,
     y: py,
     vx: pvx,
     vy: pvy,
     r: 0.75 + Math.random() * 1.45,
     color: Math.random() > 0.38 ? palette.lit : palette.mid,
     life: 1.0,
     frameDecay: 1 / (170 + Math.random() * 35)
    });
   }
  }

  function initSystem() {
   stars = [];

   pulseRings = [];

   const cx = W / 2;
   const cy = H / 2;

   AU_PIXELS = minDim * 0.14;
   const sizeScale = Math.max(0.78, Math.min(1.05, minDim / 520));

   if (labConfig.system === 'solar') {
    const starMass = 2600;
    stars.push({
     x: cx, y: cy, vx: 0, vy: 0,
     mass: starMass, r: Math.max(15, minDim * 0.036),
     color: '#ffbe0b', core: '#ffffff', glow: '#ff6d00',
     type: 'star', relativity: 0, name: 'SOL-A'
    });

    // 1. Inner Terrestrial World (1.1 AU)
    const r1 = minDim * 0.155;
    const v1 = softenedCircularSpeed(starMass, r1, STAR_SOFT);
    spawnBody(cx + r1, cy, 0, v1, 6.2 * sizeScale, 16, celestialPalettes[2], false, 'TER-01', true);

    // 2. Indefinitely Stable Jovian Giant + Retrograde Hill-Sphere Moon (2.4 AU)
    const rPair = minDim * 0.335;
    const giantMass = 220;
    const moonMass = 1.2;
    const pairMass = giantMass + moonMass;
    const vPairCM = softenedCircularSpeed(starMass, rPair, STAR_SOFT);

    const cmX = cx - rPair;
    const cmY = cy;
    const giantR = 11.5 * sizeScale;
    const moonR = 3.5 * sizeScale;

    const moonSep = Math.max(giantR + moonR + 8.5, rPair * 0.088);
    const vRel = softenedCircularSpeed(pairMass, moonSep, PLANET_SOFT);

    const giantFrac = moonMass / pairMass;
    const moonFrac = giantMass / pairMass;

    spawnBody(
     cmX, cmY + moonSep * giantFrac,
     vRel * giantFrac, -vPairCM,
     giantR, giantMass, celestialPalettes[1], true, 'JOV-02', true
    );
    spawnBody(
     cmX, cmY - moonSep * moonFrac,
     -vRel * moonFrac, -vPairCM,
     moonR, moonMass, celestialPalettes[0], false, 'SAT-2A', true
    );

    // 3. Outer Ice Planet (3.2 AU)
    const r3 = minDim * 0.445;
    const v3 = softenedCircularSpeed(starMass, r3, STAR_SOFT);
    spawnBody(cx, cy - r3, v3, 0, 7.2 * sizeScale, 24, celestialPalettes[5], false, 'NEP-03', true);

   } else if (labConfig.system === 'binary') {
    const sep = minDim * 0.105;
    const starMass = 1500;
    const vOrb = Math.sqrt((labConfig.G * starMass) / (4 * sep));
    stars.push({
     x: cx - sep, y: cy, vx: 0, vy: -vOrb,
     mass: starMass, r: Math.max(13, minDim * 0.029),
     color: '#00e5ff', core: '#ffffff', glow: '#0077ff',
     type: 'star', relativity: 0, name: 'ALPHA-A'
    });
    stars.push({
     x: cx + sep, y: cy, vx: 0, vy: vOrb,
     mass: starMass, r: Math.max(12, minDim * 0.027),
     color: '#ff9933', core: '#ffffff', glow: '#ff5500',
     type: 'star', relativity: 0, name: 'ALPHA-B'
    });

    [minDim * 0.27, minDim * 0.36, minDim * 0.44].forEach((orbitR, idx) => {
     const angle = idx * 2.1;
     const speed = softenedCircularSpeed(starMass * 2, orbitR, STAR_SOFT);
     const isGiant = idx === 1;
     spawnBody(
      cx + Math.cos(angle) * orbitR,
      cy + Math.sin(angle) * orbitR,
      -Math.sin(angle) * speed,
      Math.cos(angle) * speed,
      (isGiant ? 11.2 : 6.8) * sizeScale,
      isGiant ? 160 : 20,
      celestialPalettes[(idx + 1) % celestialPalettes.length],
      isGiant,
      `BIN-0${idx + 1}`,
      true
     );
    });

   } else if (labConfig.system === 'blackhole') {
    const bhMass = 3600;
    stars.push({
     x: cx, y: cy, vx: 0, vy: 0,
     mass: bhMass, r: Math.max(17, minDim * 0.038),
     color: '#00e5ff', core: '#000000', glow: '#38bdf8',
     type: 'blackhole', relativity: 42, name: 'SGR-A*'
    });

    const apoapsis = minDim * 0.40;
    const vCirc = softenedCircularSpeed(bhMass, apoapsis, STAR_SOFT);
    const vDive = vCirc * 0.56;

    for (let i = 0; i < 3; i++) {
     const a = (i * Math.PI * 2) / 3 - Math.PI / 6;
     spawnBody(
      cx + Math.cos(a) * apoapsis,
      cy + Math.sin(a) * apoapsis,
      -Math.sin(a) * vDive,
      Math.cos(a) * vDive,
      6.8 * sizeScale, 22,
      celestialPalettes[i % celestialPalettes.length],
      false,
      `REL-0${i + 1}`,
      true
     );
    }
   }
   syncInspectorDeckUI();
  }

  /* 3. POLAR ASTROMETRY INSTRUMENT OVERLAY & VOLUMETRIC SHADERS */
  function drawPolarAstrometryGrid() {
   if (trackedBody && !planets.includes(trackedBody)) {
    trackedBody = null;
    syncInspectorDeckUI();
   }

   const bary = getSystemBarycenter();
   const bx = trackedBody ? trackedBody.x : bary.x;
   const by = trackedBody ? trackedBody.y : bary.y;

   ctx.save();
   ctx.strokeStyle = trackedBody ? 'rgba(255, 170, 0, 0.1)' : 'rgba(148, 175, 215, 0.065)';
   ctx.fillStyle = trackedBody ? 'rgba(255, 170, 0, 0.48)' : 'rgba(148, 175, 215, 0.32)';
   ctx.font = '500 9px "JetBrains Mono", monospace';
   ctx.lineWidth = 1;

   // Crosshair Axes
   ctx.beginPath();
   ctx.moveTo(0, by); ctx.lineTo(W, by);
   ctx.moveTo(bx, 0); ctx.lineTo(bx, H);
   ctx.stroke();

   // Concentric AU Range Rings
   for (let au = 1; au <= 3; au++) {
    const r = au * AU_PIXELS;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillText(`${au}.0 AU`, bx + r + 5, by - 4);
   }

   // Degree Azimuth Ticks on the 2.0 AU Ring
   const tickR = 2 * AU_PIXELS;
   for (let deg = 0; deg < 360; deg += 30) {
    const rad = (deg * Math.PI) / 180;
    ctx.beginPath();
    ctx.moveTo(bx + Math.cos(rad) * (tickR - 3), by + Math.sin(rad) * (tickR - 3));
    ctx.lineTo(bx + Math.cos(rad) * (tickR + 3), by + Math.sin(rad) * (tickR + 3));
    ctx.stroke();
   }

   // True System Barycenter (+) Crosshair Marker
   ctx.strokeStyle = 'rgba(0, 229, 255, 0.38)';
   ctx.lineWidth = 1.2;
   ctx.beginPath();
   ctx.moveTo(bary.x - 5, bary.y); ctx.lineTo(bary.x + 5, bary.y);
   ctx.moveTo(bary.x, bary.y - 5); ctx.lineTo(bary.x, bary.y + 5);
   ctx.stroke();
   ctx.restore();
  }

  function drawInspectOverlays() {
   if (labConfig.inspectMode) {
    ctx.save();
    ctx.font = '600 8.5px "JetBrains Mono", monospace';
    for (const p of planets) {
     if (p === trackedBody) continue;
     ctx.strokeStyle = 'rgba(255, 170, 0, 0.35)';
     ctx.lineWidth = 1;
     ctx.setLineDash([2, 3]);
     ctx.beginPath();
     ctx.arc(p.x, p.y, p.r + 6, 0, Math.PI * 2);
     ctx.stroke();
     ctx.setLineDash([]);

     ctx.fillStyle = 'rgba(255, 209, 102, 0.78)';
     ctx.fillText(p.code, p.x + p.r + 7, p.y + 3);
    }
    ctx.restore();
   }

   if (!trackedBody || !planets.includes(trackedBody)) return;
   const p = trackedBody;
   const bary = getSystemBarycenter();
   const distAU = (Math.hypot(p.x - bary.x, p.y - bary.y) / AU_PIXELS).toFixed(2);
   const spd = Math.hypot(p.vx, p.vy).toFixed(2);
   const el = classifyConicSection(p.x, p.y, p.vx, p.vy, p.mass, p);

   ctx.save();
   const br = p.r + 8;
   const corner = 4.5;
   ctx.strokeStyle = '#ffaa00';
   ctx.lineWidth = 1.6;

   // 4 Technical Targeting Brackets
   ctx.beginPath();
   ctx.moveTo(p.x - br, p.y - br + corner); ctx.lineTo(p.x - br, p.y - br); ctx.lineTo(p.x - br + corner, p.y - br);
   ctx.moveTo(p.x + br - corner, p.y - br); ctx.lineTo(p.x + br, p.y - br); ctx.lineTo(p.x + br, p.y - br + corner);
   ctx.moveTo(p.x - br, p.y + br - corner); ctx.lineTo(p.x - br, p.y + br); ctx.lineTo(p.x - br + corner, p.y + br);
   ctx.moveTo(p.x + br - corner, p.y + br); ctx.lineTo(p.x + br, p.y + br); ctx.lineTo(p.x + br, p.y + br - corner);
   ctx.stroke();

   // Velocity Direction Vector Tick
   const vMag = Math.hypot(p.vx, p.vy);
   if (vMag > 0.05) {
    const ux = p.vx / vMag;
    const uy = p.vy / vMag;
    ctx.strokeStyle = 'rgba(0, 245, 155, 0.75)';
    ctx.beginPath();
    ctx.moveTo(p.x + ux * (p.r + 3), p.y + uy * (p.r + 3));
    ctx.lineTo(p.x + ux * (p.r + 18), p.y + uy * (p.r + 18));
    ctx.stroke();
   }

   // On-Canvas Complete Keplerian Readout next to Tracked Body
   const flipX = p.x > W - 155;
   const lx = flipX ? p.x - br - 7 : p.x + br + 7;
   const ly = Math.max(26, Math.min(H - 34, p.y - 8));
   ctx.textAlign = flipX ? 'right' : 'left';
   ctx.font = '700 10px "JetBrains Mono", monospace';
   ctx.fillStyle = '#ffaa00';
   ctx.fillText(`${p.code} // ${el.conic}`, lx, ly);
   ctx.font = '500 9px "JetBrains Mono", monospace';
   ctx.fillStyle = '#edf2ff';
   ctx.fillText(`r:${distAU}AU  v:${spd}  e:${el.ecc.toFixed(2)}`, lx, ly + 12);
   ctx.restore();
  }

  function drawStar(s, time) {
   ctx.save();
   const pulse = 1 + Math.sin(time * 0.0025) * 0.035;

   if (s.type === 'blackhole') {
    const diskGrad = ctx.createRadialGradient(s.x, s.y, s.r * 0.95, s.x, s.y, s.r * 3.1 * pulse);
    diskGrad.addColorStop(0, '#ffffff');
    diskGrad.addColorStop(0.16, '#00e5ff');
    diskGrad.addColorStop(0.42, 'rgba(56, 189, 248, 0.28)');
    diskGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = diskGrad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 3.1 * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = '#010204';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = '#e0f2fe';
    ctx.stroke();
   } else {
    const corona = ctx.createRadialGradient(s.x, s.y, s.r * 0.35, s.x, s.y, s.r * 2.8 * pulse);
    corona.addColorStop(0, s.core);
    corona.addColorStop(0.28, s.color);
    corona.addColorStop(0.6, s.glow + '33');
    corona.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 2.8 * pulse, 0, Math.PI * 2);
    ctx.fill();

    const bodyGrad = ctx.createRadialGradient(
     s.x - s.r * 0.2, s.y - s.r * 0.2, s.r * 0.1,
     s.x, s.y, s.r
    );
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(0.6, s.color);
    bodyGrad.addColorStop(1, s.glow);

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
   }
   ctx.restore();
  }

  function drawVolumetricPlanet(p) {
   let lightStar = stars[0];
   if (stars.length > 1) {
    let minD = 999999;
    for (const s of stars) {
     const d = Math.hypot(s.x - p.x, s.y - p.y);
     if (d < minD) { minD = d; lightStar = s; }
    }
   }
   const lightAngle = lightStar ? Math.atan2(lightStar.y - p.y, lightStar.x - p.x) : -Math.PI / 4;
   const lx = Math.cos(lightAngle);
   const ly = Math.sin(lightAngle);

   ctx.save();

   if (p.hasRing) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-0.35);
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 2.15, p.r * 0.55, 0, Math.PI, Math.PI * 2);
    ctx.strokeStyle = p.palette.lit + '77';
    ctx.lineWidth = Math.max(1.8, p.r * 0.22);
    ctx.stroke();
    ctx.restore();
   }

   const highlightX = p.x + lx * p.r * 0.42;
   const highlightY = p.y + ly * p.r * 0.42;
   const sphereGrad = ctx.createRadialGradient(
    highlightX, highlightY, p.r * 0.08,
    p.x - lx * p.r * 0.25, p.y - ly * p.r * 0.25, p.r * 1.15
   );
   sphereGrad.addColorStop(0, p.palette.lit);
   sphereGrad.addColorStop(0.48, p.palette.mid);
   sphereGrad.addColorStop(0.84, p.palette.dark);
   sphereGrad.addColorStop(1, '#020307');

   ctx.beginPath();
   ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
   ctx.fillStyle = sphereGrad;
   ctx.shadowColor = p.palette.atmo;
   ctx.shadowBlur = 8;
   ctx.fill();

   ctx.beginPath();
   ctx.arc(p.x, p.y, p.r - 0.4, lightAngle - 1.1, lightAngle + 1.1);
   ctx.strokeStyle = p.palette.lit;
   ctx.lineWidth = 1.2;
   ctx.stroke();

   if (p.hasRing) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-0.35);
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 2.15, p.r * 0.55, 0, 0, Math.PI);
    ctx.strokeStyle = p.palette.lit + 'bb';
    ctx.lineWidth = Math.max(1.8, p.r * 0.22);
    ctx.stroke();
    ctx.restore();
   }

   ctx.restore();
  }

  /* 4. SHARED DETERMINISTIC N-BODY INTEGRATOR */
  function advanceStarsAndPlanetsOneSubstep(sList, pList, h) {
   if (sList.length >= 2) {
    for (let i = 0; i < sList.length; i++) {
     for (let j = i + 1; j < sList.length; j++) {
      const s0 = sList[i], s1 = sList[j];
      const dx = s1.x - s0.x;
      const dy = s1.y - s0.y;
      const distSq = dx * dx + dy * dy + 140;
      const dist = Math.sqrt(distSq);
      const f = (labConfig.G * s0.mass * s1.mass) / distSq;
      const fx = (dx / dist) * f;
      const fy = (dy / dist) * f;

      if (!s0.held) {
       s0.vx += (fx / s0.mass) * h;
       s0.vy += (fy / s0.mass) * h;
      }
      if (!s1.held) {
       s1.vx -= (fx / s1.mass) * h;
       s1.vy -= (fy / s1.mass) * h;
      }
     }
    }
    for (let i = 0; i < sList.length; i++) {
     const s = sList[i];
     if (!s.held) {
      s.x += s.vx * h;
      s.y += s.vy * h;
     }
    }
   }

   const n = pList.length;
   for (let i = 0; i < n; i++) {
    pList[i].ax = 0;
    pList[i].ay = 0;
   }

   for (let i = 0; i < n; i++) {
    const p = pList[i];
    if (!p.held) {
     for (let sIdx = 0; sIdx < sList.length; sIdx++) {
      const s = sList[sIdx];
      const dx = s.x - p.x;
      const dy = s.y - p.y;
      const distSq = dx * dx + dy * dy + STAR_SOFT;
      const dist = Math.sqrt(distSq);
      const relBoost = s.relativity ? (1 + (s.relativity * s.r) / distSq) : 1;
      const accel = ((labConfig.G * s.mass) / distSq) * relBoost;
      p.ax += (dx / dist) * accel;
      p.ay += (dy / dist) * accel;
     }
    }

    for (let j = i + 1; j < n; j++) {
     const other = pList[j];
     const dx = other.x - p.x;
     const dy = other.y - p.y;
     // Gently soften mutual pull during initial swarm dispersion so rocks fan into an arc before accreting
     const bothInSwarmGrace = (p.swarmGrace > 0 && other.swarmGrace > 0);
     const soft = bothInSwarmGrace ? 95 : PLANET_SOFT;
     const distSq = dx * dx + dy * dy + soft;
     const dist = Math.sqrt(distSq);
     const nx = dx / dist;
     const ny = dy / dist;

     if (!p.held) {
      const aP = (labConfig.G * other.mass) / distSq;
      p.ax += nx * aP;
      p.ay += ny * aP;
     }
     if (!other.held) {
      const aO = (labConfig.G * p.mass) / distSq;
      other.ax -= nx * aO;
      other.ay -= ny * aO;
     }
    }
   }

   for (let i = 0; i < n; i++) {
    const p = pList[i];
    if (p.held) continue;
    p.vx += p.ax * h;
    p.vy += p.ay * h;
    p.x += p.vx * h;
    p.y += p.vy * h;
   }
  }

  function stepPhysics() {
   if (!labStarted || labConfig.timeScale === 0) return;

   const isAiming = interaction && (interaction.mode === 'slingNew' || interaction.mode === 'slingExisting');
   const subSteps = (isAiming && labConfig.slowMoAim) ? 1 : (4 * labConfig.timeScale);
   const h = H_STEP * (isAiming && labConfig.slowMoAim ? 0.65 : 1.0);

   for (let step = 0; step < subSteps; step++) {
    advanceStarsAndPlanetsOneSubstep(stars, planets, h);

    for (let i = planets.length - 1; i >= 0; i--) {
     const p = planets[i];
     if (!p || p.held) continue;
     if (p.swarmGrace > 0) p.swarmGrace -= h;

     // 1. Planet-Planet Physical Mergers & Emergent Stellar Ignition
     let merged = false;
     for (let j = i - 1; j >= 0; j--) {
      const other = planets[j];
      if (!other || other.held) continue;

      // Delay asteroid-to-asteroid fusion until each pair's orbital dispersion grace window finishes
      if (p.swarmGrace > 0 && other.swarmGrace > 0) continue;

      const dist = Math.hypot(other.x - p.x, other.y - p.y);
      if (dist < (p.r + other.r) * 0.78) {
       const totalMass = p.mass + other.mass;
       const bigger = p.mass >= other.mass ? p : other;
       const smaller = p.mass < other.mass ? p : other;
       other.vx = (p.vx * p.mass + other.vx * other.mass) / totalMass;
       other.vy = (p.vy * p.mass + other.vy * other.mass) / totalMass;
       other.x = (p.x * p.mass + other.x * other.mass) / totalMass;
       other.y = (p.y * p.mass + other.y * other.mass) / totalMass;
       other.r = Math.min(16, Math.cbrt(Math.pow(p.r, 3) + Math.pow(other.r, 3)));
       other.mass = totalMass;
       other.palette = bigger.palette;
       if (totalMass > 60) other.hasRing = true;
       if (trackedBody === p) trackedBody = other;

       const powderCount = totalMass < 3 ? 16 : 45;
       spawnOrbitalPowder(other.x, other.y, other.vx, other.vy, smaller.palette, powderCount, null);
       planets.splice(i, 1);

       // Check Emergent Stellar Ignition Threshold!
       if (other.mass >= IGNITION_MASS_THRESHOLD) {
        const newStar = {
         x: other.x, y: other.y,
         vx: other.vx, vy: other.vy,
         mass: 1450,
         r: Math.max(13, Math.min(W, H) * 0.029),
         color: '#00f59b', core: '#ffffff', glow: '#00e5ff',
         type: 'star', relativity: 0,
         name: `NOVA-${stars.length + 1}`
        };
        stars.push(newStar);
        if (trackedBody === other) trackedBody = null;
        const idxOther = planets.indexOf(other);
        if (idxOther !== -1) planets.splice(idxOther, 1);

        spawnPulseRing(newStar.x, newStar.y, newStar.r, newStar.r + 95, '#00f59b', 0.022);
        spawnCallout(newStar.x, newStar.y - 22, `★ STELLAR IGNITION // ${newStar.name} BORN`, '#00f59b');
        sfx.playIgnitionChord();
        shake = Math.min(10, shake + 6);
        syncInspectorDeckUI();
       } else {
        sfx.playImpact();
        shake = Math.min(6, shake + (totalMass < 3 ? 0.8 : 2.5));
       }
       merged = true;
       break;
      }
     }
     if (merged) continue;

     // 2. Gravity-Assist Slingshot Detection around Jovian Giants
     if (p.slingshotCooldown > 0) p.slingshotCooldown -= h;
     const curSpeed = Math.hypot(p.vx, p.vy);
     if (p.mass < 35 && p.slingshotCooldown <= 0) {
      for (const g of planets) {
       if (g === p || g.mass < 120) continue;
       const dGiant = Math.hypot(g.x - p.x, g.y - p.y);
       if (dGiant < g.r * 3.6 && curSpeed - p.prevSpeed > 0.28) {
        spawnCallout(p.x, p.y - 14, 'SLINGSHOT +Δv', '#00e5ff');
        sfx.playPeriapsisPing(0.88);
        p.slingshotCooldown = 95;
        break;
       }
      }
     }
     p.prevSpeed = curSpeed;

     // 3. Direct Physical Surface Impact with Star / Event Horizon -> 3-Second Swirling Powder
     let minStarDist = 99999;
     let closestStar = stars[0];
     for (const s of stars) {
      const d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < minStarDist) {
       minStarDist = d;
       closestStar = s;
      }
     }

     if (closestStar && minStarDist < closestStar.r + p.r * 0.45) {
      spawnOrbitalPowder(p.x, p.y, p.vx, p.vy, p.palette, 75, closestStar);
      spawnPulseRing(p.x, p.y, 3, 28, p.palette.lit, 0.045);
      sfx.playImpact();
      shake = Math.min(7, shake + 3);
      if (trackedBody === p) {
       trackedBody = null;
       syncInspectorDeckUI();
      }
      planets.splice(i, 1);
      continue;
     }

     // 4. Periapsis Acoustic Telemetry Ping
     if (p.periapsisCooldown > 0) p.periapsisCooldown -= h;
     if (minStarDist < p.prevDist) {
      p.approaching = true;
     } else if (p.approaching && minStarDist > p.prevDist) {
      p.approaching = false;
      if (p.periapsisCooldown <= 0 && minStarDist < Math.min(W, H) * 0.48) {
       sfx.playPeriapsisPing(Math.min(1, curSpeed / 8.5));
       p.periapsisCooldown = 40;
      }
     }
     p.prevDist = minStarDist;

     if (p.x < -W || p.x > W * 2 || p.y < -H || p.y > H * 2) {
      if (trackedBody === p) {
       trackedBody = null;
       syncInspectorDeckUI();
      }
      planets.splice(i, 1);
     }
    }

    // Update 3-Second Dissolving Orbital Powder
    for (let i = impactDebris.length - 1; i >= 0; i--) {
     const d = impactDebris[i];
     d.life -= (d.frameDecay / 4) * (h / H_STEP);
     if (d.life <= 0) {
      impactDebris.splice(i, 1);
      continue;
     }
     let ax = 0, ay = 0;
     for (const s of stars) {
      const dx = s.x - d.x;
      const dy = s.y - d.y;
      const distSq = dx * dx + dy * dy + STAR_SOFT;
      const dist = Math.sqrt(distSq);

      const minSurface = s.r * 1.03;
      if (dist < minSurface) {
       const nx = -dx / dist;
       const ny = -dy / dist;
       d.x = s.x + nx * minSurface;
       d.y = s.y + ny * minSurface;
       const vDotN = (d.vx - s.vx) * nx + (d.vy - s.vy) * ny;
       if (vDotN < 0) {
        d.vx -= 1.35 * vDotN * nx;
        d.vy -= 1.35 * vDotN * ny;
       }
      }

      const accel = (labConfig.G * s.mass) / distSq;
      ax += (dx / dist) * accel;
      ay += (dy / dist) * accel;
     }
     d.vx += ax * h;
     d.vy += ay * h;
     d.x += d.vx * h;
     d.y += d.vy * h;
    }
   }

   // Record Orbital Trails
   const maxTrailLen = labConfig.longTrails ? 340 : 68;
   for (const p of planets) {
    if (p.held) continue;
    p.trail.push({ x: p.x, y: p.y });
    while (p.trail.length > maxTrailLen) p.trail.shift();
   }

   // Update Expanding Pulse Rings & Callouts
   for (let i = pulseRings.length - 1; i >= 0; i--) {
    const pr = pulseRings[i];
    pr.life -= pr.speed;
    pr.r += (pr.maxR - pr.r) * 0.14;
    if (pr.life <= 0) pulseRings.splice(i, 1);
   }

   for (let i = floatingCallouts.length - 1; i >= 0; i--) {
    const fc = floatingCallouts[i];
    fc.y -= 0.35;
    fc.life -= 0.016;
    if (fc.life <= 0) floatingCallouts.splice(i, 1);
   }
  }

  // Silky-Smooth Per-Vertex Cubic Smoothstep Trail Tapering + Swirling Powder Renderer
  function drawTrailsAndDebris() {
   ctx.save();
   ctx.lineCap = 'round';
   ctx.lineJoin = 'round';

   for (const p of planets) {
    const trail = p.trail;
    const len = trail.length;
    if (len < 2) continue;
    ctx.strokeStyle = p.palette.mid;

    if (labConfig.longTrails) {
     // Persistent Precession Mode: Per-vertex smoothstep taper on oldest 45%, seamless join to crisp 55% head
     const taperEnd = Math.max(2, Math.floor((len - 1) * 0.45));
     for (let i = 0; i < taperEnd; i++) {
      const t = (i + 1) / taperEnd;
      const s = t * t * (3 - 2 * t); // Cubic Hermite smoothstep (0.0 -> 1.0)
      ctx.globalAlpha = 0.01 + 0.59 * s;
      ctx.lineWidth = 0.15 + 1.25 * s;
      ctx.beginPath();
      ctx.moveTo(trail[i].x, trail[i].y);
      ctx.lineTo(trail[i + 1].x, trail[i + 1].y);
      ctx.stroke();
     }
     if (len - 1 > taperEnd) {
      ctx.globalAlpha = 0.60;
      ctx.lineWidth = 1.40;
      ctx.beginPath();
      ctx.moveTo(trail[taperEnd].x, trail[taperEnd].y);
      for (let i = taperEnd + 1; i < len; i++) {
       ctx.lineTo(trail[i].x, trail[i].y);
      }
      ctx.stroke();
     }
    } else {
     // Normal Trail Mode: Continuous per-vertex smoothstep taper across the entire comet wake
     const totalSegs = len - 1;
     for (let i = 0; i < totalSegs; i++) {
      const t = (i + 1) / totalSegs;
      const s = t * t * (3 - 2 * t);
      ctx.globalAlpha = 0.01 + 0.56 * (s * s);
      ctx.lineWidth = 0.15 + 1.70 * s;
      ctx.beginPath();
      ctx.moveTo(trail[i].x, trail[i].y);
      ctx.lineTo(trail[i + 1].x, trail[i + 1].y);
      ctx.stroke();
     }
    }
   }
   ctx.restore();

   // Draw 3-Second Dissolving Orbital Powder
   ctx.save();
   ctx.globalCompositeOperation = 'lighter';
   for (const d of impactDebris) {
    ctx.globalAlpha = Math.max(0, d.life * 0.9);
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * (0.35 + 0.65 * d.life), 0, Math.PI * 2);
    ctx.fill();
   }
   ctx.restore();

   // Draw Expanding Telemetry Pulse Rings & Callouts
   ctx.save();
   for (const pr of pulseRings) {
    ctx.globalAlpha = Math.max(0, pr.life * 0.75);
    ctx.strokeStyle = pr.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2);
    ctx.stroke();
   }

   ctx.font = '700 10px "JetBrains Mono", monospace';
   ctx.textAlign = 'center';
   for (const fc of floatingCallouts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, fc.life * 1.4));
    ctx.fillStyle = fc.color;
    ctx.fillText(fc.text, Math.max(70, Math.min(W - 70, fc.x)), Math.max(24, fc.y));
   }
   ctx.restore();
  }

  /* 5. FLIGHT COMPUTER: CONIC CLASSIFIER + LIVE PE / AP APSIDES TELEMETRY */
  function classifyConicSection(x, y, vx, vy, mass, targetPlanet) {
   for (const p of planets) {
    if (p === targetPlanet || p.mass < 80 || mass >= p.mass) continue;
    const dx = x - p.x;
    const dy = y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 90) {
     const rvx = vx - p.vx;
     const rvy = vy - p.vy;
     const vRelSq = rvx * rvx + rvy * rvy;
     const muGiant = labConfig.G * (p.mass + mass);
     const specE = 0.5 * vRelSq - muGiant / Math.sqrt(d * d + PLANET_SOFT);
     if (specE < 0) {
      const hz = dx * rvy - dy * rvx;
      const ecc = Math.sqrt(Math.max(0, 1 + (2 * specE * hz * hz) / (muGiant * muGiant)));
      return {
       conic: 'SATELLITE CAPTURE',
       ecc,
       vMag: Math.sqrt(vRelSq),
       color: '#c084fc'
      };
     }
    }
   }

   const bary = getSystemBarycenter();
   const rx = x - bary.x;
   const ry = y - bary.y;
   const r = Math.sqrt(rx * rx + ry * ry + STAR_SOFT);
   const rvx = vx - bary.vx;
   const rvy = vy - bary.vy;
   const vSq = rvx * rvx + rvy * rvy;
   const mu = labConfig.G * (bary.mass + mass);

   const specEnergy = 0.5 * vSq - mu / r;
   const hz = rx * rvy - ry * rvx;
   const eSq = 1 + (2 * specEnergy * hz * hz) / (mu * mu);
   const ecc = Math.sqrt(Math.max(0, eSq));
   const vMag = Math.sqrt(vSq);

   if (specEnergy < 0) {
    if (ecc < 0.05) {
     return { conic: 'CIRCULAR ORBIT', ecc, vMag, color: '#00f59b' };
    }
    return { conic: 'ELLIPTICAL ORBIT', ecc, vMag, color: '#00e5ff' };
   } else if (ecc < 1.04) {
    return { conic: 'PARABOLIC ESCAPE', ecc, vMag, color: '#ffaa00' };
   } else {
    return { conic: 'HYPERBOLIC ESCAPE', ecc: Math.min(9.9, ecc), vMag, color: '#ff6b35' };
   }
  }

  function drawMarkerNode(x, y, label, subVal, color) {
   ctx.save();
   ctx.strokeStyle = color;
   ctx.fillStyle = '#030508';
   ctx.lineWidth = 1.5;

   const sz = 4.5;
   ctx.beginPath();
   ctx.moveTo(x, y - sz);
   ctx.lineTo(x + sz, y);
   ctx.lineTo(x, y + sz);
   ctx.lineTo(x - sz, y);
   ctx.closePath();
   ctx.fill();
   ctx.stroke();

   const flipX = x > W - 95;
   ctx.textAlign = flipX ? 'right' : 'left';
   ctx.font = '600 9.5px "JetBrains Mono", monospace';
   ctx.fillStyle = color;
   ctx.fillText(`${label} ${subVal}`, flipX ? x - 8 : x + 8, y + 3);
   ctx.restore();
  }

  function drawFlightComputerPredictor() {
   if (!interaction) return;

   // On-Canvas HUD Tag when dragging a Star
   if (interaction.mode === 'dragStar') {
    const s = interaction.star;
    ctx.save();
    const flipX = s.x > W - 175;
    const lx = flipX ? s.x - s.r - 10 : s.x + s.r + 10;
    const ly = Math.max(24, Math.min(H - 24, s.y - 4));
    ctx.textAlign = flipX ? 'right' : 'left';
    ctx.font = '700 10px "JetBrains Mono", monospace';
    ctx.fillStyle = '#00e5ff';
    ctx.fillText(`SHIFTING [${s.name}]`, lx, ly);
    ctx.font = '500 9px "JetBrains Mono", monospace';
    ctx.fillStyle = '#9fb0cc';
    ctx.fillText('BARYCENTER RELOCATION', lx, ly + 12);
    ctx.restore();
    return;
   }

   const { startX, startY, vx, vy, r, mass, palette, hasRing, targetPlanet } = interaction;

   const simStars = stars.map(s => ({ ...s, held: false }));
   const simPlanets = planets
    .filter(p => p !== targetPlanet)
    .map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, r: p.r, mass: p.mass, held: false, ax: 0, ay: 0, swarmGrace: 0 }));

   const testBody = {
    x: startX, y: startY, vx, vy, r, mass, held: false, ax: 0, ay: 0, swarmGrace: 0
   };
   simPlanets.push(testBody);

   const telemetry = classifyConicSection(startX, startY, vx, vy, mass, targetPlanet);
   const modeTag = (interaction.mode === 'slingNew' && !interaction.hasDragged) ? 'AUTO-CIRCULAR // ' : '';
   let hudHeader = `${modeTag}${telemetry.conic}`;
   let pathColor = telemetry.color;

   const totalSteps = labConfig.deepPredict ? 1850 : 620;
   const path = [{ x: startX, y: startY }];

   let peNode = null, apNode = null;
   let prevR = null, prevWasDecreasing = null;
   let impactPoint = null;

   for (let step = 0; step < totalSteps; step++) {
    advanceStarsAndPlanetsOneSubstep(simStars, simPlanets, H_STEP);

    let bx = simStars[0].x, by = simStars[0].y;
    if (simStars.length >= 2) {
     let tm = 0; bx = 0; by = 0;
     for (const s of simStars) { tm += s.mass; bx += s.x * s.mass; by += s.y * s.mass; }
     bx /= tm; by /= tm;
    }
    const curR = Math.hypot(testBody.x - bx, testBody.y - by);

    if (prevR !== null && step > 6) {
     const isDecreasing = curR < prevR;
     if (prevWasDecreasing === true && !isDecreasing && !peNode) {
      peNode = { x: testBody.x, y: testBody.y, au: (curR / AU_PIXELS).toFixed(2) };
     } else if (prevWasDecreasing === false && isDecreasing && !apNode) {
      apNode = { x: testBody.x, y: testBody.y, au: (curR / AU_PIXELS).toFixed(2) };
     }
     prevWasDecreasing = isDecreasing;
    } else if (prevR !== null) {
     prevWasDecreasing = curR < prevR;
    }
    prevR = curR;

    let hit = false;
    for (let sIdx = 0; sIdx < simStars.length; sIdx++) {
     const s = simStars[sIdx];
     if (Math.hypot(s.x - testBody.x, s.y - testBody.y) < s.r + r * 0.45) {
      hudHeader = `IMPACT (${s.name})`;
      pathColor = '#ff3366';
      impactPoint = { x: testBody.x, y: testBody.y };
      hit = true;
      break;
     }
    }
    if (hit) {
     path.push({ x: testBody.x, y: testBody.y });
     break;
    }

    for (let pIdx = 0; pIdx < simPlanets.length - 1; pIdx++) {
     const sp = simPlanets[pIdx];
     if (Math.hypot(sp.x - testBody.x, sp.y - testBody.y) < (sp.r + r) * 0.78) {
      const willIgnite = (sp.mass + mass) >= IGNITION_MASS_THRESHOLD;
      hudHeader = willIgnite ? '★ STELLAR IGNITION' : 'ORBITAL MERGER';
      pathColor = willIgnite ? '#00f59b' : '#ffaa00';
      impactPoint = { x: testBody.x, y: testBody.y };
      hit = true;
      break;
     }
    }
    if (hit) {
     path.push({ x: testBody.x, y: testBody.y });
     break;
    }

    if (step % 3 === 0) {
     path.push({ x: testBody.x, y: testBody.y });
    }
    if (testBody.x < -W * 0.6 || testBody.x > W * 1.6 || testBody.y < -H * 0.6 || testBody.y > H * 1.6) {
     break;
    }
   }

   ctx.save();
   ctx.beginPath();
   for (let i = 0; i < path.length; i++) {
    if (i === 0) ctx.moveTo(path[i].x, path[i].y);
    else ctx.lineTo(path[i].x, path[i].y);
   }
   ctx.setLineDash([4, 4]);
   ctx.strokeStyle = pathColor;
   ctx.lineWidth = 1.4;
   ctx.stroke();
   ctx.setLineDash([]);

   if (peNode && !impactPoint) {
    drawMarkerNode(peNode.x, peNode.y, 'PE', `${peNode.au}AU`, '#00f59b');
   }
   if (apNode && telemetry.ecc < 1.0 && !impactPoint) {
    drawMarkerNode(apNode.x, apNode.y, 'AP', `${apNode.au}AU`, '#00e5ff');
   }
   if (impactPoint) {
    drawMarkerNode(impactPoint.x, impactPoint.y, 'IMPACT', '', '#ff3366');
   }

   const vecEndX = interaction.hasDragged ? interaction.curX : (startX + vx / VEL_SCALE);
   const vecEndY = interaction.hasDragged ? interaction.curY : (startY + vy / VEL_SCALE);
   ctx.beginPath();
   ctx.moveTo(startX, startY);
   ctx.lineTo(vecEndX, vecEndY);
   ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
   ctx.lineWidth = 1.2;
   ctx.stroke();

   if (interaction.mode === 'slingNew') {
    drawVolumetricPlanet({ x: startX, y: startY, r, palette, hasRing });
   }

   // Edge-Safe Live Cursor HUD Readout
   const refX = interaction.curX;
   const refY = interaction.curY;
   const flipLeft = refX > W - 185;
   const hudX = flipLeft ? Math.max(170, refX - 14) : Math.max(10, refX + 14);
   const hudY = Math.max(22, Math.min(H - 26, refY - 10));

   ctx.textAlign = flipLeft ? 'right' : 'left';
   ctx.font = '700 10px "JetBrains Mono", monospace';
   ctx.fillStyle = pathColor;
   ctx.fillText(hudHeader, hudX, hudY);
   ctx.font = '500 9.5px "JetBrains Mono", monospace';
   ctx.fillStyle = '#9fb0cc';
   ctx.fillText(`v:${telemetry.vMag.toFixed(2)}  e:${telemetry.ecc.toFixed(3)}`, hudX, hudY + 13);

   ctx.restore();
  }

  /* 6. POINTER INTERACTION & DEDICATED INSPECT MODE */
  function isForcedLandscapeRotationActive() {
   return window.matchMedia('(orientation: portrait) and (max-width: 900px)').matches;
  }

  function getCanvasCoords(e) {
   const rect = canvas.getBoundingClientRect();
   if (isForcedLandscapeRotationActive()) {
    return {
     x: (e.clientY - rect.top) * (W / rect.height),
     y: (rect.right - e.clientX) * (H / rect.width)
    };
   }
   return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height)
   };
  }

  const VEL_SCALE = 0.068;
  const TAP_THRESHOLD = 7;

  canvas.addEventListener('pointerdown', e => {
   unlockLab(false);
   const pt = getCanvasCoords(e);

   // Dedicated INSPECT MODE: Never grabs or alters orbits; only selects/deselects planets
   if (labConfig.inspectMode) {
    let bestPlanet = null;
    let bestDist = 34;
    for (const p of planets) {
     const d = Math.hypot(pt.x - p.x, pt.y - p.y);
     if (d < p.r + bestDist) {
      bestDist = d;
      bestPlanet = p;
     }
    }
    trackedBody = bestPlanet;
    if (bestPlanet) {
     spawnPulseRing(bestPlanet.x, bestPlanet.y, bestPlanet.r, bestPlanet.r + 18, '#ffaa00', 0.055);
     sfx.playPeriapsisPing(0.65);
    }
    syncInspectorDeckUI();
    return;
   }

   canvas.setPointerCapture(e.pointerId);

   // 1. Check if user grabbed a Star or Singularity
   for (const s of stars) {
    if (Math.hypot(pt.x - s.x, pt.y - s.y) <= s.r + 16) {
     s.held = true;
     interaction = {
      pointerId: e.pointerId,
      mode: 'dragStar',
      star: s
     };
     return;
    }
   }

   // 2. Check if user grabbed an existing Planet, Moon, or Gas Giant to redirect
   for (let i = planets.length - 1; i >= 0; i--) {
    const p = planets[i];
    if (Math.hypot(pt.x - p.x, pt.y - p.y) <= p.r + 14) {
     p.held = true;
     p.trail = [];
     interaction = {
      pointerId: e.pointerId,
      mode: 'slingExisting',
      targetPlanet: p,
      downX: pt.x,
      downY: pt.y,
      hasDragged: true,
      startX: p.x,
      startY: p.y,
      curX: p.x + p.vx / VEL_SCALE,
      curY: p.y + p.vy / VEL_SCALE,
      vx: p.vx,
      vy: p.vy,
      r: p.r,
      mass: p.mass,
      palette: p.palette,
      hasRing: p.hasRing
     };
     return;
    }
   }

   // 3. Otherwise, prepare new payload (Quick-Tap = Auto Circular, Drag = Free Slingshot)
   const minDim = Math.min(W, H);
   const sizeScale = Math.max(0.78, Math.min(1.05, minDim / 520));
   const isSwarm = labConfig.launchClass === 'swarm';
   const spec = massClasses[labConfig.launchClass];
   const pal = celestialPalettes[Math.floor(Math.random() * celestialPalettes.length)];
   const autoCirc = computeAutoCircularVelocity(pt.x, pt.y, spec.mass);

   interaction = {
    pointerId: e.pointerId,
    mode: 'slingNew',
    isSwarm,
    sizeScale,
    targetPlanet: null,
    downX: pt.x,
    downY: pt.y,
    hasDragged: false,
    startX: pt.x,
    startY: pt.y,
    curX: pt.x,
    curY: pt.y,
    vx: autoCirc.vx,
    vy: autoCirc.vy,
    r: spec.r * sizeScale,
    mass: spec.mass,
    palette: pal,
    hasRing: spec.hasRing
   };
  });

  canvas.addEventListener('pointermove', e => {
   if (!interaction || e.pointerId !== interaction.pointerId) return;
   const pt = getCanvasCoords(e);

   if (interaction.mode === 'dragStar') {
    const s = interaction.star;
    s.vx = (pt.x - s.x) * 0.25;
    s.vy = (pt.y - s.y) * 0.25;
    s.x = pt.x;
    s.y = pt.y;
   } else {
    const dragDist = Math.hypot(pt.x - interaction.downX, pt.y - interaction.downY);
    if (dragDist >= TAP_THRESHOLD) {
     interaction.hasDragged = true;
    }
    interaction.curX = pt.x;
    interaction.curY = pt.y;

    if (interaction.hasDragged) {
     // 100% Free Analog Aiming (Zero Magnetic Snap)
     interaction.vx = (pt.x - interaction.startX) * VEL_SCALE;
     interaction.vy = (pt.y - interaction.startY) * VEL_SCALE;
    } else if (interaction.mode === 'slingNew') {
     const autoCirc = computeAutoCircularVelocity(interaction.startX, interaction.startY, interaction.mass);
     interaction.vx = autoCirc.vx;
     interaction.vy = autoCirc.vy;
    }
   }
  });

  function finishInteraction(e) {
   if (!interaction || e.pointerId !== interaction.pointerId) return;

   if (interaction.mode === 'dragStar') {
    interaction.star.held = false;
    if (stars.length === 1) {
     interaction.star.vx = 0;
     interaction.star.vy = 0;
    }
   } else if (interaction.mode === 'slingExisting') {
    const p = interaction.targetPlanet;
    p.held = false;
    p.vx = interaction.vx;
    p.vy = interaction.vy;
    sfx.playInject();
   } else if (interaction.mode === 'slingNew') {
    if (interaction.isSwarm) {
     spawnSwarmCluster(
      interaction.startX,
      interaction.startY,
      interaction.vx,
      interaction.vy,
      interaction.sizeScale,
      interaction.palette
     );
    } else {
     spawnBody(
      interaction.startX,
      interaction.startY,
      interaction.vx,
      interaction.vy,
      interaction.r,
      interaction.mass,
      interaction.palette,
      interaction.hasRing
     );
    }
    sfx.playInject();
   }

   interaction = null;
  }

  canvas.addEventListener('pointerup', finishInteraction);
  canvas.addEventListener('pointercancel', finishInteraction);

  /* 7. INSPECT MODE FLIGHT DECK CONTROLS (PROGRADE, RETROGRADE, DETONATE) */
  document.getElementById('inspectModeBtn').addEventListener('click', () => {
   unlockLab(false);
   labConfig.inspectMode = !labConfig.inspectMode;
   if (labConfig.inspectMode && !trackedBody && planets.length > 0) {
    trackedBody = planets.reduce((best, cur) => (cur.mass > best.mass ? cur : best), planets[0]);
   }
   syncInspectorDeckUI();
  });

  document.getElementById('btnExitInspect').addEventListener('click', e => {
   e.stopPropagation();
   labConfig.inspectMode = false;
   trackedBody = null;
   syncInspectorDeckUI();
  });

  function applyOrbitalBurn(factor, label, color) {
   if (!trackedBody || !planets.includes(trackedBody)) return;
   const p = trackedBody;
   const spd = Math.hypot(p.vx, p.vy);
   if (spd < 0.02) return;
   const ux = p.vx / spd;
   const uy = p.vy / spd;

   p.vx *= factor;
   p.vy *= factor;

   const dir = factor > 1 ? -1 : 1;
   for (let i = 0; i < 12; i++) {
    const a = Math.atan2(uy * dir, ux * dir) + (Math.random() - 0.5) * 0.6;
    const v = 0.8 + Math.random() * 1.4;
    impactDebris.push({
     x: p.x + ux * dir * (p.r + 2),
     y: p.y + uy * dir * (p.r + 2),
     vx: p.vx + Math.cos(a) * v,
     vy: p.vy + Math.sin(a) * v,
     r: 0.9 + Math.random() * 0.9,
     color,
     life: 0.65,
     frameDecay: 1 / 45
    });
   }
   spawnCallout(p.x, p.y - p.r - 10, label, color);
   sfx.playThruster();
  }

  document.getElementById('btnPrograde').addEventListener('click', e => {
   e.stopPropagation();
   applyOrbitalBurn(1.09, 'PROGRADE +Δv', '#00f59b');
  });

  document.getElementById('btnRetrograde').addEventListener('click', e => {
   e.stopPropagation();
   applyOrbitalBurn(0.91, 'RETROGRADE -Δv', '#00e5ff');
  });

  document.getElementById('btnDetonate').addEventListener('click', e => {
   e.stopPropagation();
   if (!trackedBody || !planets.includes(trackedBody)) return;
   const p = trackedBody;
   spawnOrbitalPowder(p.x, p.y, p.vx, p.vy, p.palette, 80, null);
   spawnPulseRing(p.x, p.y, p.r, p.r + 48, '#ff3366', 0.038);
   spawnCallout(p.x, p.y - 12, `${p.code} SHATTERED`, '#ff3366');
   sfx.playImpact();
   shake = Math.min(7, shake + 3.5);

   const idx = planets.indexOf(p);
   if (idx !== -1) planets.splice(idx, 1);
   trackedBody = planets.length > 0 ? planets[0] : null;
   syncInspectorDeckUI();
  });

  /* 8. NON-DESTRUCTIVE RESIZE, UI BINDINGS & FIXED-TIMESTEP LOOP */
  function resizeCanvas() {
   const frame = document.getElementById('canvasFrame');
   const dpr = Math.min(window.devicePixelRatio || 1, 2);
   const newW = Math.max(260, Math.floor(frame.clientWidth));
   const newH = Math.max(220, Math.floor(frame.clientHeight));

   const hadSystem = stars.length > 0;
   if (Math.abs(newW - W) < 4 && Math.abs(newH - H) < 4 && hadSystem) return;

   const dx = (newW - W) / 2;
   const dy = (newH - H) / 2;

   W = newW;
   H = newH;
   AU_PIXELS = Math.min(W, H) * 0.14;
   canvas.width = W * dpr;
   canvas.height = H * dpr;
   ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
   createBackgroundStars();

   if (!hadSystem) {
    initSystem();
   } else {
    for (const s of stars) { s.x += dx; s.y += dy; }
    for (const p of planets) {
     p.x += dx;
     p.y += dy;
     for (const pt of p.trail) { pt.x += dx; pt.y += dy; }
    }
    for (const d of impactDebris) { d.x += dx; d.y += dy; }
    if (interaction && interaction.mode !== 'dragStar') {
     interaction.startX += dx;
     interaction.startY += dy;
     interaction.curX += dx;
     interaction.curY += dy;
     interaction.downX += dx;
     interaction.downY += dy;
    }
   }
  }

  const resizeObserver = new ResizeObserver(() => resizeCanvas());
  resizeObserver.observe(document.getElementById('canvasFrame'));
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));

  document.getElementById('soundBtn').addEventListener('click', e => {
   sfx.init();
   sfx.enabled = !sfx.enabled;
   e.target.classList.toggle('active', sfx.enabled);
   e.target.textContent = sfx.enabled ? 'AUDIO: ON' : 'AUDIO: OFF';
  });

  // Dynamic PAUSE <-> ▶ PLAY & Time-Warp Selector
  const pausePlayBtn = document.getElementById('pausePlayBtn');

  function syncTimeWarpButtons() {
   const isPaused = labConfig.timeScale === 0;
   document.querySelectorAll('#timeWarpGroup .pill-btn').forEach(b => {
    const spd = Number(b.dataset.speed);
    if (spd === 0) {
     b.textContent = isPaused ? '▶ PLAY' : 'PAUSE';
     b.classList.toggle('paused-play', isPaused);
     b.classList.remove('active');
    } else {
     b.classList.toggle('active', !isPaused && labConfig.timeScale === spd);
    }
   });
  }

  document.querySelectorAll('#timeWarpGroup .pill-btn').forEach(btn => {
   btn.addEventListener('click', () => {
    const requestedSpeed = Number(btn.dataset.speed);
    if (requestedSpeed === 0) {
     if (labConfig.timeScale === 0) {
      // Resume at previous active speed when tapping ▶ PLAY
      labConfig.timeScale = labConfig.lastActiveSpeed || 1;
     } else {
      labConfig.lastActiveSpeed = labConfig.timeScale;
      labConfig.timeScale = 0;
     }
    } else {
     labConfig.timeScale = requestedSpeed;
     labConfig.lastActiveSpeed = requestedSpeed;
    }
    syncTimeWarpButtons();
    unlockLab(false);
   });
  });

  // Mass Class Selector
  document.querySelectorAll('#massSelectGroup .pill-btn').forEach(btn => {
   btn.addEventListener('click', () => {
    document.querySelectorAll('#massSelectGroup .pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    labConfig.launchClass = btn.dataset.mass;
   });
  });

  document.getElementById('toggleDeepPredict').addEventListener('change', e => {
   labConfig.deepPredict = e.target.checked;
  });
  document.getElementById('toggleSlowMo').addEventListener('change', e => {
   labConfig.slowMoAim = e.target.checked;
  });
  document.getElementById('toggleLongTrails').addEventListener('change', e => {
   labConfig.longTrails = e.target.checked;
   if (!labConfig.longTrails) {
    planets.forEach(p => { if (p.trail.length > 68) p.trail.splice(0, p.trail.length - 68); });
   }
  });

  // 3 Gravitational Regimes
  document.querySelectorAll('#systemPresetGroup .pill-btn').forEach(btn => {
   btn.addEventListener('click', () => {
    document.querySelectorAll('#systemPresetGroup .pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    labConfig.system = btn.dataset.system;
    unlockLab(false);
    initSystem();
   });
  });

  document.getElementById('resetSystemBtn').addEventListener('click', () => {
   unlockLab(false);
   initSystem();
  });

  // Fixed-Timestep 60Hz Physics Accumulator
  const FIXED_STEP_MS = 1000 / 60;
  let lastFrameTime = performance.now();
  let physicsAccumulator = 0;

  function animate(now) {
   requestAnimationFrame(animate);
   const elapsed = Math.min(100, Math.max(0, now - lastFrameTime));
   lastFrameTime = now;
   physicsAccumulator += elapsed;

   while (physicsAccumulator >= FIXED_STEP_MS) {
    stepPhysics();
    if (shake > 0.15) {
     shake *= 0.84;
    } else {
     shake = 0;
    }
    physicsAccumulator -= FIXED_STEP_MS;
   }

   ctx.save();
   ctx.fillStyle = '#020408';
   ctx.fillRect(0, 0, W, H);

   if (shake > 0.15) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
   }

   // Deep Space Reference Stars
   ctx.fillStyle = '#ffffff';
   for (const st of bgStars) {
    ctx.globalAlpha = st.alpha;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
    ctx.fill();
   }
   ctx.globalAlpha = 1;

   drawPolarAstrometryGrid();
   drawTrailsAndDebris();

   for (const s of stars) drawStar(s, now);
   for (const p of planets) drawVolumetricPlanet(p);

   drawInspectOverlays();
   drawFlightComputerPredictor();
   ctx.restore();
  }

  syncTimeWarpButtons();
  resizeCanvas();
  requestAnimationFrame(animate);
 </script>
</body>
