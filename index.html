<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON LABS // Astrodynamics & Orbital Studio</title>
  <style>
    :root {
      --bg-deep: #030508;
      --bg-panel: rgba(10, 14, 22, 0.95);
      --bg-card: rgba(18, 24, 38, 0.72);
      --border-glass: rgba(148, 175, 215, 0.12);
      --text-main: #edf2ff;
      --text-muted: #7e8da8;
      --accent-cyan: #00e5ff;
      --accent-teal: #00f59b;
      --accent-amber: #ffaa00;
      --accent-crimson: #ff3366;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 35% 20%, #0b1120 0%, #030508 75%);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow: hidden;
      touch-action: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Header - Flush Left & Right Alignment */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 16px;
      background: rgba(6, 9, 15, 0.92);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      white-space: nowrap;
      color: #ffffff;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      flex-shrink: 0;
    }

    .brand-sub {
      color: var(--text-muted);
      font-weight: 500;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .icon-btn.active {
      background: rgba(0, 229, 255, 0.12);
      border-color: rgba(0, 229, 255, 0.45);
      color: var(--accent-cyan);
    }

    /* Workspace */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .stage-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px 16px;
      overflow: hidden;
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #020408;
      border: 1px solid rgba(148, 175, 215, 0.16);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* Bottom Telemetry Status Bar */
    .telemetry-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 10, 18, 0.86);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.22);
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: #9fb0cc;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    .telemetry-bar strong {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Start Overlay */
    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 9, 0.72);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      cursor: pointer;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 20px;
      text-align: center;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-badge {
      padding: 14px 28px;
      border-radius: 6px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.55);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.18);
      color: #ffffff;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.84rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      animation: pulseFrame 2.2s infinite ease-in-out;
    }

    .start-sub {
      margin-top: 10px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    @keyframes pulseFrame {
      0%, 100% { border-color: rgba(0, 229, 255, 0.45); box-shadow: 0 0 25px rgba(0, 229, 255, 0.15); }
      50% { border-color: rgba(0, 229, 255, 0.9); box-shadow: 0 0 38px rgba(0, 229, 255, 0.3); }
    }

    /* Control Sidebar */
    .control-panel {
      width: 305px;
      background: var(--bg-panel);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-glass);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 15;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      background: rgba(0, 229, 255, 0.12);
      color: #fff;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .action-btn:hover {
      background: rgba(0, 229, 255, 0.22);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.25);
    }

    .action-btn.secondary {
      border-color: rgba(255, 170, 0, 0.45);
      background: rgba(255, 170, 0, 0.12);
      color: #ffd166;
    }

    .action-btn.secondary.all-on {
      border-color: var(--border-glass);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .control-section {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 0.64rem;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      color: var(--accent-cyan);
    }

    /* Toggle Switch Row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 500;
      color: #d0daee;
    }

    .toggle-row:hover { color: #fff; }

    .switch {
      position: relative;
      width: 36px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #8b9bb4;
      border-radius: 2px;
      transition: 0.2s;
    }

    .switch input:checked + .slider-toggle {
      background: rgba(0, 229, 255, 0.2);
      border-color: var(--accent-cyan);
    }

    .switch input:checked + .slider-toggle:before {
      transform: translateX(18px);
      background-color: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* 3 Single-Row Segmented Telemetry Buttons */
    .pill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 7px 4px;
      border-radius: 5px;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .pill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .pill-btn.active {
      background: rgba(0, 229, 255, 0.14);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.15);
    }

    /* Mobile Portrait Responsive Layout */
    @media (max-width: 860px) {
      .top-bar { padding: 8px 12px; }
      .workspace { flex-direction: column; }
      .stage-container { flex: 1; padding: 6px 12px; }
      .control-panel {
        width: 100%;
        height: auto;
        border-left: none;
        border-top: 1px solid var(--border-glass);
        padding: 8px 12px 10px;
        gap: 6px;
      }
      .control-section {
        padding: 7px 10px;
        gap: 6px;
      }
      .action-btn {
        padding: 8px 8px;
      }
      .pill-btn {
        padding: 6px 4px;
        font-size: 0.65rem;
      }
      .telemetry-bar {
        font-size: 0.62rem;
        padding: 4px 10px;
        bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Clean Technical Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>NEON LABS <span class="brand-sub">// ASTRODYNAMICS</span></span>
      </div>

      <button class="icon-btn active" id="soundBtn">AUDIO: ON</button>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
      <div class="stage-container">
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="simCanvas"></canvas>

          <div class="telemetry-bar" id="telemetryBar">
            <strong>INTERACTIVE TELEMETRY</strong> // DRAG EMPTY SPACE TO INJECT ORBIT • GRAB ANY BODY TO REDIRECT
          </div>

          <!-- Tap Anywhere Overlay -->
          <div class="start-overlay" id="startOverlay">
            <div class="start-badge">INITIALIZE ORBITAL TELEMETRY</div>
            <div class="start-sub">TAP ANYWHERE TO ENGAGE N-BODY INTEGRATOR &amp; ACOUSTIC TELEMETRY</div>
          </div>
        </div>
      </div>

      <!-- Technical Controls Sidebar -->
      <aside class="control-panel">
        <!-- Quick Actions at the Top -->
        <div class="btn-row">
          <button class="action-btn" id="resetSystemBtn">RESET SYSTEM</button>
          <button class="action-btn secondary" id="allTogglesBtn">ALL MODES ON</button>
        </div>

        <!-- 3-Tier Payload Mass Selector -->
        <div class="control-section">
          <div class="section-label">Payload Mass Class</div>
          <div class="pill-grid" id="massSelectGroup">
            <button class="pill-btn" data-mass="moon">SATELLITE</button>
            <button class="pill-btn active" data-mass="planet">TERRESTRIAL</button>
            <button class="pill-btn" data-mass="giant">JOVIAN</button>
          </div>
        </div>

        <!-- 3 Core Flight Computer Toggles -->
        <div class="control-section">
          <div class="section-label">Flight Computer &amp; Optics</div>
          <label class="toggle-row">
            <span>Deep-Range Orbit Predictor</span>
            <div class="switch"><input type="checkbox" id="toggleDeepPredict" checked /><span class="slider-toggle"></span></div>
          </label>
          <label class="toggle-row">
            <span>Time Dilation While Aiming</span>
            <div class="switch"><input type="checkbox" id="toggleSlowMo" checked /><span class="slider-toggle"></span></div>
          </label>
          <label class="toggle-row">
            <span>Persistent Precession Trails</span>
            <div class="switch"><input type="checkbox" id="toggleLongTrails" /><span class="slider-toggle"></span></div>
          </label>
        </div>

        <!-- 3 Distinct Gravitational Regimes -->
        <div class="control-section">
          <div class="section-label">Gravitational Regime</div>
          <div class="pill-grid" id="systemPresetGroup">
            <button class="pill-btn active" data-system="solar">SOLAR</button>
            <button class="pill-btn" data-system="binary">BINARY</button>
            <button class="pill-btn" data-system="blackhole">SINGULARITY</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    /* 1. ACOUSTIC TELEMETRY SYNTHESIZER */
    class TelemetryAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastNoteTime = 0;
        this.scale = [196.00, 220.00, 246.94, 277.18, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33, 659.25, 739.99];
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      canPlay(gap = 50) {
        if (!this.enabled) return false;
        this.init();
        if (!this.ctx) return false;
        const now = performance.now();
        if (now - this.lastNoteTime < gap) return false;
        this.lastNoteTime = now;
        return true;
      }

      playPeriapsisPing(speedRatio = 0.5) {
        if (!this.canPlay(65)) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const idx = Math.min(this.scale.length - 1, Math.max(0, Math.floor(speedRatio * this.scale.length)));
        osc.type = 'sine';
        osc.frequency.setValueAtTime(this.scale[idx], t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.065, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.36);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.38);
      }

      playInject() {
        if (!this.canPlay(40)) return;
        const t = this.ctx.currentTime;
        [329.63, 493.88, 659.25].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + i * 0.025);
          gain.gain.setValueAtTime(0.05, t + i * 0.025);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.025 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.025);
          osc.stop(t + i * 0.025 + 0.26);
        });
      }

      playImpact() {
        if (!this.canPlay(65)) return;
        const t = this.ctx.currentTime;
        [146.83, 220.00, 293.66].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.03);
          gain.gain.setValueAtTime(0.07, t + i * 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.03 + 0.42);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.03);
          osc.stop(t + i * 0.03 + 0.44);
        });
      }
    }

    const sfx = new TelemetryAudio();
    let labStarted = false;

    function unlockLab() {
      if (labStarted) return;
      labStarted = true;
      sfx.init();
      document.getElementById('startOverlay').classList.add('hidden');
      sfx.playInject();
    }

    document.getElementById('startOverlay').addEventListener('pointerdown', e => {
      e.stopPropagation();
      unlockLab();
    });

    /* 2. DETERMINISTIC N-BODY ASTRODYNAMICS ENGINE */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    let W = 800, H = 600, shake = 0;

    // Shared deterministic substep size for 1:1 parity between predictor and live physics
    const H_STEP = 0.21;
    const STAR_SOFT = 36;
    const PLANET_SOFT = 10;
    let AU_PIXELS = 120; // Dynamically scaled per viewport

    const labConfig = {
      deepPredict: true,
      slowMoAim: true,
      longTrails: false,
      launchClass: 'planet', // 'moon' | 'planet' | 'giant'
      system: 'solar',
      G: 0.42
    };

    const massClasses = {
      moon:   { r: 3.6,  mass: 1.2,   hasRing: false, code: 'SAT-1', label: 'SATELLITE' },
      planet: { r: 6.8,  mass: 22.0,  hasRing: false, code: 'TER-2', label: 'TERRESTRIAL' },
      giant:  { r: 11.8, mass: 220.0, hasRing: true,  code: 'JOV-3', label: 'JOVIAN GIANT' }
    };

    // Astronomical Celestial Palettes
    const celestialPalettes = [
      { name: 'Europa Glacial',  lit: '#d8f8ff', mid: '#38bdf8', dark: '#06192e', atmo: 'rgba(56, 189, 248, 0.45)' },
      { name: 'Jovian Ochre',    lit: '#fff1d0', mid: '#e09f3e', dark: '#281505', atmo: 'rgba(224, 159, 62, 0.45)' },
      { name: 'Terrestrial',     lit: '#cceeff', mid: '#2563eb', dark: '#051026', atmo: 'rgba(59, 130, 246, 0.5)' },
      { name: 'Martian Ferric',  lit: '#ffd8be', mid: '#ea580c', dark: '#290b04', atmo: 'rgba(234, 88, 12, 0.45)' },
      { name: 'Titan Haze',      lit: '#fef08a', mid: '#ca8a04', dark: '#261702', atmo: 'rgba(234, 179, 8, 0.45)' },
      { name: 'Neptunian Deep',  lit: '#bae6fd', mid: '#0284c7', dark: '#041322', atmo: 'rgba(2, 132, 199, 0.45)' }
    ];

    let stars = [];
    let planets = [];
    let impactDebris = [];
    let bgStars = [];
    let interaction = null;
    let bodyCounter = 1;

    function createBackgroundStars() {
      bgStars = [];
      for (let i = 0; i < 110; i++) {
        bgStars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.4 + Math.random() * 1.1,
          alpha: 0.12 + Math.random() * 0.45
        });
      }
    }

    function softenedCircularSpeed(mass, dist, softSq) {
      return dist * Math.sqrt((labConfig.G * mass) / Math.pow(dist * dist + softSq, 1.5));
    }

    function spawnBody(x, y, vx, vy, r, mass, palette, hasRing = false, designation = null) {
      const code = designation || `OBJ-${String(bodyCounter++).padStart(2, '0')}`;
      const body = {
        x, y, vx, vy,
        r, mass,
        code,
        palette: palette || celestialPalettes[Math.floor(Math.random() * celestialPalettes.length)],
        hasRing,
        trail: [],
        prevDist: 99999,
        approaching: false,
        periapsisCooldown: 0,
        held: false
      };
      planets.push(body);
      return body;
    }

    // 3-Second Dissolving Impact Debris (~180 frames at 60fps)
    function spawnImpactDebris(x, y, vx, vy, palette, count = 38) {
      if (impactDebris.length > 260) impactDebris.splice(0, count);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spread = Math.random() * 6;
        const dv = (0.2 + Math.random() * 1.1);
        impactDebris.push({
          x: x + Math.cos(a) * spread,
          y: y + Math.sin(a) * spread,
          vx: vx * 0.65 + Math.cos(a) * dv,
          vy: vy * 0.65 + Math.sin(a) * dv,
          r: 0.9 + Math.random() * 1.3,
          color: Math.random() > 0.4 ? palette.lit : palette.mid,
          life: 1.0,
          decay: 1 / (165 + Math.random() * 35) // Dissolves completely in ~3 seconds
        });
      }
    }

    function initSystem() {
      stars = [];
      planets = [];
      impactDebris = [];
      interaction = null;
      bodyCounter = 1;

      const cx = W / 2;
      const cy = H / 2;
      const minDim = Math.min(W, H);
      AU_PIXELS = minDim * 0.14;
      const sizeScale = Math.max(0.78, Math.min(1.05, minDim / 520));

      if (labConfig.system === 'solar') {
        const starMass = 2600;
        stars.push({
          x: cx, y: cy, vx: 0, vy: 0,
          mass: starMass, r: Math.max(15, minDim * 0.036),
          color: '#ffbe0b', core: '#ffffff', glow: '#ff6d00',
          type: 'star', relativity: 0, name: 'SOL-A'
        });

        // 1. Inner Terrestrial World (1.1 AU)
        const r1 = minDim * 0.155;
        const v1 = softenedCircularSpeed(starMass, r1, STAR_SOFT);
        spawnBody(cx + r1, cy, 0, v1, 6.2 * sizeScale, 16, celestialPalettes[2], false, 'TER-01');

        // 2. Indefinitely Stable Jovian Giant + Retrograde Hill-Sphere Moon (2.4 AU)
        const rPair = minDim * 0.335;
        const giantMass = 220;
        const moonMass = 1.2;
        const pairMass = giantMass + moonMass;
        const vPairCM = softenedCircularSpeed(starMass, rPair, STAR_SOFT);

        const cmX = cx - rPair;
        const cmY = cy;
        const giantR = 11.5 * sizeScale;
        const moonR = 3.5 * sizeScale;

        const moonSep = Math.max(giantR + moonR + 8.5, rPair * 0.088);
        const vRel = softenedCircularSpeed(pairMass, moonSep, PLANET_SOFT);

        const giantFrac = moonMass / pairMass;
        const moonFrac = giantMass / pairMass;

        spawnBody(
          cmX, cmY + moonSep * giantFrac,
          vRel * giantFrac, -vPairCM,
          giantR, giantMass, celestialPalettes[1], true, 'JOV-02'
        );
        spawnBody(
          cmX, cmY - moonSep * moonFrac,
          -vRel * moonFrac, -vPairCM,
          moonR, moonMass, celestialPalettes[0], false, 'SAT-2A'
        );

        // 3. Outer Ice Planet (3.2 AU)
        const r3 = minDim * 0.445;
        const v3 = softenedCircularSpeed(starMass, r3, STAR_SOFT);
        spawnBody(cx, cy - r3, v3, 0, 7.2 * sizeScale, 24, celestialPalettes[5], false, 'NEP-03');

      } else if (labConfig.system === 'binary') {
        const sep = minDim * 0.105;
        const starMass = 1500;
        const vOrb = Math.sqrt((labConfig.G * starMass) / (4 * sep));
        stars.push({
          x: cx - sep, y: cy, vx: 0, vy: -vOrb,
          mass: starMass, r: Math.max(13, minDim * 0.029),
          color: '#00e5ff', core: '#ffffff', glow: '#0077ff',
          type: 'star', relativity: 0, name: 'ALPHA-A'
        });
        stars.push({
          x: cx + sep, y: cy, vx: 0, vy: vOrb,
          mass: starMass, r: Math.max(12, minDim * 0.027),
          color: '#ff9933', core: '#ffffff', glow: '#ff5500',
          type: 'star', relativity: 0, name: 'ALPHA-B'
        });

        [minDim * 0.27, minDim * 0.36, minDim * 0.44].forEach((orbitR, idx) => {
          const angle = idx * 2.1;
          const speed = softenedCircularSpeed(starMass * 2, orbitR, STAR_SOFT);
          const isGiant = idx === 1;
          spawnBody(
            cx + Math.cos(angle) * orbitR,
            cy + Math.sin(angle) * orbitR,
            -Math.sin(angle) * speed,
            Math.cos(angle) * speed,
            (isGiant ? 11.2 : 6.8) * sizeScale,
            isGiant ? 160 : 20,
            celestialPalettes[(idx + 1) % celestialPalettes.length],
            isGiant,
            `BIN-0${idx + 1}`
          );
        });

      } else if (labConfig.system === 'blackhole') {
        // Supermassive Singularity with strong Einsteinian Relativistic Precession (1/r^3 term)
        const bhMass = 3600;
        stars.push({
          x: cx, y: cy, vx: 0, vy: 0,
          mass: bhMass, r: Math.max(17, minDim * 0.038),
          color: '#00e5ff', core: '#000000', glow: '#38bdf8',
          type: 'blackhole', relativity: 42, name: 'SGR-A*'
        });

        // 3 High-Eccentricity Relativistic Precession Orbiters (skim the photon ring & rotate apsides!)
        const apoapsis = minDim * 0.40;
        const vCirc = softenedCircularSpeed(bhMass, apoapsis, STAR_SOFT);
        const vDive = vCirc * 0.56; // Dives close to the event horizon without crashing!

        for (let i = 0; i < 3; i++) {
          const a = (i * Math.PI * 2) / 3 - Math.PI / 6;
          spawnBody(
            cx + Math.cos(a) * apoapsis,
            cy + Math.sin(a) * apoapsis,
            -Math.sin(a) * vDive,
            Math.cos(a) * vDive,
            6.8 * sizeScale, 22,
            celestialPalettes[i % celestialPalettes.length],
            false,
            `REL-0${i + 1}`
          );
        }
      }
    }

    /* 3. POLAR ASTROMETRY INSTRUMENT OVERLAY & VOLUMETRIC SHADERS */
    function drawPolarAstrometryGrid() {
      // Center on system barycenter
      let totalM = 0, bx = W / 2, by = H / 2;
      if (stars.length > 0) {
        bx = 0; by = 0;
        for (const s of stars) {
          totalM += s.mass;
          bx += s.x * s.mass;
          by += s.y * s.mass;
        }
        bx /= totalM;
        by /= totalM;
      }

      ctx.save();
      ctx.strokeStyle = 'rgba(148, 175, 215, 0.065)';
      ctx.fillStyle = 'rgba(148, 175, 215, 0.32)';
      ctx.font = '500 9px "JetBrains Mono", monospace';
      ctx.lineWidth = 1;

      // Subtle Crosshair Axes
      ctx.beginPath();
      ctx.moveTo(0, by); ctx.lineTo(W, by);
      ctx.moveTo(bx, 0); ctx.lineTo(bx, H);
      ctx.stroke();

      // Concentric AU Range Rings (1.0 AU, 2.0 AU, 3.0 AU)
      for (let au = 1; au <= 3; au++) {
        const r = au * AU_PIXELS;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillText(`${au}.0 AU`, bx + r + 5, by - 4);
      }

      // Degree Azimuth Ticks on the 2.0 AU Ring
      const tickR = 2 * AU_PIXELS;
      for (let deg = 0; deg < 360; deg += 30) {
        const rad = (deg * Math.PI) / 180;
        ctx.beginPath();
        ctx.moveTo(bx + Math.cos(rad) * (tickR - 3), by + Math.sin(rad) * (tickR - 3));
        ctx.lineTo(bx + Math.cos(rad) * (tickR + 3), by + Math.sin(rad) * (tickR + 3));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawStar(s, time) {
      ctx.save();
      const pulse = 1 + Math.sin(time * 0.0025) * 0.035;

      if (s.type === 'blackhole') {
        // Relativistic Accretion Lensing Halo
        const diskGrad = ctx.createRadialGradient(s.x, s.y, s.r * 0.95, s.x, s.y, s.r * 3.1 * pulse);
        diskGrad.addColorStop(0, '#ffffff');
        diskGrad.addColorStop(0.16, '#00e5ff');
        diskGrad.addColorStop(0.42, 'rgba(56, 189, 248, 0.28)');
        diskGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = diskGrad;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.1 * pulse, 0, Math.PI * 2);
        ctx.fill();

        // Event Horizon Shadow & Photon Ring
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = '#010204';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = '#e0f2fe';
        ctx.stroke();
      } else {
        const corona = ctx.createRadialGradient(s.x, s.y, s.r * 0.35, s.x, s.y, s.r * 2.8 * pulse);
        corona.addColorStop(0, s.core);
        corona.addColorStop(0.28, s.color);
        corona.addColorStop(0.6, s.glow + '33');
        corona.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = corona;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 2.8 * pulse, 0, Math.PI * 2);
        ctx.fill();

        const bodyGrad = ctx.createRadialGradient(
          s.x - s.r * 0.2, s.y - s.r * 0.2, s.r * 0.1,
          s.x, s.y, s.r
        );
        bodyGrad.addColorStop(0, '#ffffff');
        bodyGrad.addColorStop(0.6, s.color);
        bodyGrad.addColorStop(1, s.glow);

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = bodyGrad;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawVolumetricPlanet(p) {
      let lightStar = stars[0];
      if (stars.length > 1) {
        const d0 = Math.hypot(stars[0].x - p.x, stars[0].y - p.y);
        const d1 = Math.hypot(stars[1].x - p.x, stars[1].y - p.y);
        lightStar = d0 < d1 ? stars[0] : stars[1];
      }
      const lightAngle = lightStar ? Math.atan2(lightStar.y - p.y, lightStar.x - p.x) : -Math.PI / 4;
      const lx = Math.cos(lightAngle);
      const ly = Math.sin(lightAngle);

      ctx.save();

      if (p.hasRing) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.35);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 2.15, p.r * 0.55, 0, Math.PI, Math.PI * 2);
        ctx.strokeStyle = p.palette.lit + '77';
        ctx.lineWidth = Math.max(1.8, p.r * 0.22);
        ctx.stroke();
        ctx.restore();
      }

      const highlightX = p.x + lx * p.r * 0.42;
      const highlightY = p.y + ly * p.r * 0.42;
      const sphereGrad = ctx.createRadialGradient(
        highlightX, highlightY, p.r * 0.08,
        p.x - lx * p.r * 0.25, p.y - ly * p.r * 0.25, p.r * 1.15
      );
      sphereGrad.addColorStop(0, p.palette.lit);
      sphereGrad.addColorStop(0.48, p.palette.mid);
      sphereGrad.addColorStop(0.84, p.palette.dark);
      sphereGrad.addColorStop(1, '#020307');

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = sphereGrad;
      ctx.shadowColor = p.palette.atmo;
      ctx.shadowBlur = 8;
      ctx.fill();

      // Crisp Atmospheric Limb Highlight
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r - 0.4, lightAngle - 1.1, lightAngle + 1.1);
      ctx.strokeStyle = p.palette.lit;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      if (p.hasRing) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.35);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 2.15, p.r * 0.55, 0, 0, Math.PI);
        ctx.strokeStyle = p.palette.lit + 'bb';
        ctx.lineWidth = Math.max(1.8, p.r * 0.22);
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    /* 4. SHARED DETERMINISTIC N-BODY INTEGRATOR (NO CLOSE-APPROACH SHREDDING) */
    function advanceStarsAndPlanetsOneSubstep(sList, pList, h) {
      if (sList.length === 2) {
        const s0 = sList[0], s1 = sList[1];
        const dx = s1.x - s0.x;
        const dy = s1.y - s0.y;
        const distSq = dx * dx + dy * dy + 140;
        const dist = Math.sqrt(distSq);
        const f = (labConfig.G * s0.mass * s1.mass) / distSq;
        const fx = (dx / dist) * f;
        const fy = (dy / dist) * f;

        if (!s0.held) {
          s0.vx += (fx / s0.mass) * h;
          s0.vy += (fy / s0.mass) * h;
          s0.x += s0.vx * h;
          s0.y += s0.vy * h;
        }
        if (!s1.held) {
          s1.vx -= (fx / s1.mass) * h;
          s1.vy -= (fy / s1.mass) * h;
          s1.x += s1.vx * h;
          s1.y += s1.vy * h;
        }
      }

      const n = pList.length;
      for (let i = 0; i < n; i++) {
        pList[i].ax = 0;
        pList[i].ay = 0;
      }

      for (let i = 0; i < n; i++) {
        const p = pList[i];
        if (!p.held) {
          for (let sIdx = 0; sIdx < sList.length; sIdx++) {
            const s = sList[sIdx];
            const dx = s.x - p.x;
            const dy = s.y - p.y;
            const distSq = dx * dx + dy * dy + STAR_SOFT;
            const dist = Math.sqrt(distSq);
            // Einstein 1/r^3 relativistic precession term for Singularity
            const relBoost = s.relativity ? (1 + (s.relativity * s.r) / distSq) : 1;
            const accel = ((labConfig.G * s.mass) / distSq) * relBoost;
            p.ax += (dx / dist) * accel;
            p.ay += (dy / dist) * accel;
          }
        }

        for (let j = i + 1; j < n; j++) {
          const other = pList[j];
          const dx = other.x - p.x;
          const dy = other.y - p.y;
          const distSq = dx * dx + dy * dy + PLANET_SOFT;
          const dist = Math.sqrt(distSq);
          const nx = dx / dist;
          const ny = dy / dist;

          if (!p.held) {
            const aP = (labConfig.G * other.mass) / distSq;
            p.ax += nx * aP;
            p.ay += ny * aP;
          }
          if (!other.held) {
            const aO = (labConfig.G * p.mass) / distSq;
            other.ax -= nx * aO;
            other.ay -= ny * aO;
          }
        }
      }

      for (let i = 0; i < n; i++) {
        const p = pList[i];
        if (p.held) continue;
        p.vx += p.ax * h;
        p.vy += p.ay * h;
        p.x += p.vx * h;
        p.y += p.vy * h;
      }
    }

    function stepPhysics(dt) {
      if (!labStarted) return;

      const isAiming = interaction && (interaction.mode === 'slingNew' || interaction.mode === 'slingExisting');
      const subSteps = (isAiming && labConfig.slowMoAim) ? 1 : 4;
      const h = H_STEP * (isAiming && labConfig.slowMoAim ? 0.65 : 1.0);

      for (let step = 0; step < subSteps; step++) {
        advanceStarsAndPlanetsOneSubstep(stars, planets, h);

        // Check Physical Surface Impacts & Planet Mergers (Zero close-approach shredding!)
        for (let i = planets.length - 1; i >= 0; i--) {
          const p = planets[i];
          if (p.held) continue;

          // 1. Planet-Planet Physical Mergers
          let merged = false;
          for (let j = i - 1; j >= 0; j--) {
            const other = planets[j];
            if (other.held) continue;
            const dist = Math.hypot(other.x - p.x, other.y - p.y);
            if (dist < (p.r + other.r) * 0.78) {
              const totalMass = p.mass + other.mass;
              const bigger = p.mass >= other.mass ? p : other;
              const smaller = p.mass < other.mass ? p : other;
              other.vx = (p.vx * p.mass + other.vx * other.mass) / totalMass;
              other.vy = (p.vy * p.mass + other.vy * other.mass) / totalMass;
              other.x = (p.x * p.mass + other.x * other.mass) / totalMass;
              other.y = (p.y * p.mass + other.y * other.mass) / totalMass;
              other.r = Math.min(16, Math.cbrt(Math.pow(p.r, 3) + Math.pow(other.r, 3)));
              other.mass = totalMass;
              other.palette = bigger.palette;
              if (totalMass > 60) other.hasRing = true;

              spawnImpactDebris(other.x, other.y, other.vx, other.vy, smaller.palette, 32);
              sfx.playImpact();
              shake = Math.min(6, shake + 2.5);
              planets.splice(i, 1);
              merged = true;
              break;
            }
          }
          if (merged) continue;

          // 2. Direct Physical Surface Impact with Star / Event Horizon
          let minStarDist = 99999;
          let closestStar = stars[0];
          for (const s of stars) {
            const d = Math.hypot(s.x - p.x, s.y - p.y);
            if (d < minStarDist) {
              minStarDist = d;
              closestStar = s;
            }
          }

          if (closestStar && minStarDist < closestStar.r + p.r * 0.45) {
            spawnImpactDebris(p.x, p.y, p.vx * 0.5, p.vy * 0.5, p.palette, 42);
            sfx.playImpact();
            shake = Math.min(7, shake + 3);
            planets.splice(i, 1);
            continue;
          }

          // 3. Periapsis Acoustic Telemetry Ping
          if (p.periapsisCooldown > 0) p.periapsisCooldown -= h;
          if (minStarDist < p.prevDist) {
            p.approaching = true;
          } else if (p.approaching && minStarDist > p.prevDist) {
            p.approaching = false;
            if (p.periapsisCooldown <= 0 && minStarDist < Math.min(W, H) * 0.48) {
              const spd = Math.hypot(p.vx, p.vy);
              sfx.playPeriapsisPing(Math.min(1, spd / 8.5));
              p.periapsisCooldown = 40;
            }
          }
          p.prevDist = minStarDist;

          if (p.x < -W || p.x > W * 2 || p.y < -H || p.y > H * 2) {
            planets.splice(i, 1);
          }
        }

        // Update 3-Second Dissolving Impact Debris
        for (let i = impactDebris.length - 1; i >= 0; i--) {
          const d = impactDebris[i];
          d.life -= d.decay * (h / H_STEP);
          if (d.life <= 0) {
            impactDebris.splice(i, 1);
            continue;
          }
          let ax = 0, ay = 0, swallowed = false;
          for (const s of stars) {
            const dx = s.x - d.x;
            const dy = s.y - d.y;
            const distSq = dx * dx + dy * dy + STAR_SOFT;
            const dist = Math.sqrt(distSq);
            if (dist < s.r * 0.9) {
              swallowed = true;
              break;
            }
            const accel = (labConfig.G * s.mass) / distSq;
            ax += (dx / dist) * accel;
            ay += (dy / dist) * accel;
          }
          if (swallowed) {
            impactDebris.splice(i, 1);
            continue;
          }
          d.vx += ax * h;
          d.vy += ay * h;
          d.x += d.vx * h;
          d.y += d.vy * h;
        }
      }

      // Record Crisp Vector Orbital Trails
      const maxTrailLen = labConfig.longTrails ? 340 : 65;
      for (const p of planets) {
        if (p.held) continue;
        p.trail.push({ x: p.x, y: p.y });
        while (p.trail.length > maxTrailLen) p.trail.shift();
      }
    }

    function drawTrailsAndDebris() {
      ctx.save();
      ctx.lineCap = 'round';
      for (const p of planets) {
        if (p.trail.length < 2) continue;
        ctx.beginPath();
        for (let t = 0; t < p.trail.length; t++) {
          if (t === 0) ctx.moveTo(p.trail[t].x, p.trail[t].y);
          else ctx.lineTo(p.trail[t].x, p.trail[t].y);
        }
        ctx.strokeStyle = p.palette.mid;
        ctx.globalAlpha = labConfig.longTrails ? 0.58 : 0.36;
        ctx.lineWidth = labConfig.longTrails ? 1.35 : 1.15;
        ctx.stroke();
      }
      ctx.restore();

      // Draw Dissolving Impact Debris
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const d of impactDebris) {
        ctx.globalAlpha = d.life * 0.85;
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r * (0.5 + 0.5 * d.life), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    /* 5. FLIGHT COMPUTER: CONIC CLASSIFIER + LIVE PE / AP APSIDES TELEMETRY */
    function classifyConicSection(x, y, vx, vy, mass, targetPlanet) {
      // 1. Check Satellite Capture around a Jovian Giant
      for (const p of planets) {
        if (p === targetPlanet || p.mass < 80 || mass >= p.mass) continue;
        const dx = x - p.x;
        const dy = y - p.y;
        const d = Math.hypot(dx, dy);
        if (d < 90) {
          const rvx = vx - p.vx;
          const rvy = vy - p.vy;
          const vRelSq = rvx * rvx + rvy * rvy;
          const muGiant = labConfig.G * (p.mass + mass);
          const specE = 0.5 * vRelSq - muGiant / Math.sqrt(d * d + PLANET_SOFT);
          if (specE < 0) {
            const hz = dx * rvy - dy * rvx;
            const ecc = Math.sqrt(Math.max(0, 1 + (2 * specE * hz * hz) / (muGiant * muGiant)));
            return {
              conic: 'SATELLITE CAPTURE',
              ecc,
              vMag: Math.sqrt(vRelSq),
              color: '#c084fc'
            };
          }
        }
      }

      // 2. Compute Conic Section & Eccentricity relative to System Barycenter
      let totalStarMass = 0, cmX = 0, cmY = 0, cmVx = 0, cmVy = 0;
      for (const s of stars) {
        totalStarMass += s.mass;
        cmX += s.x * s.mass;
        cmY += s.y * s.mass;
        cmVx += s.vx * s.mass;
        cmVy += s.vy * s.mass;
      }
      if (totalStarMass > 0) {
        cmX /= totalStarMass;
        cmY /= totalStarMass;
        cmVx /= totalStarMass;
        cmVy /= totalStarMass;
      }

      const rx = x - cmX;
      const ry = y - cmY;
      const r = Math.sqrt(rx * rx + ry * ry + STAR_SOFT);
      const rvx = vx - cmVx;
      const rvy = vy - cmVy;
      const vSq = rvx * rvx + rvy * rvy;
      const mu = labConfig.G * (totalStarMass + mass);

      const specEnergy = 0.5 * vSq - mu / r;
      const hz = rx * rvy - ry * rvx;
      const eSq = 1 + (2 * specEnergy * hz * hz) / (mu * mu);
      const ecc = Math.sqrt(Math.max(0, eSq));
      const vMag = Math.sqrt(vSq);

      if (specEnergy < 0) {
        if (ecc < 0.05) {
          return { conic: 'CIRCULAR ORBIT', ecc, vMag, color: '#00f59b' };
        }
        return { conic: 'ELLIPTICAL ORBIT', ecc, vMag, color: '#00e5ff' };
      } else if (ecc < 1.04) {
        return { conic: 'PARABOLIC ESCAPE', ecc, vMag, color: '#ffaa00' };
      } else {
        return { conic: 'HYPERBOLIC ESCAPE', ecc: Math.min(9.9, ecc), vMag, color: '#ff6b35' };
      }
    }

    function drawMarkerNode(x, y, label, subVal, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = '#030508';
      ctx.lineWidth = 1.5;

      // Diamond Technical Node
      const sz = 4.5;
      ctx.beginPath();
      ctx.moveTo(x, y - sz);
      ctx.lineTo(x + sz, y);
      ctx.lineTo(x, y + sz);
      ctx.lineTo(x - sz, y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Monospace Node Tag
      ctx.font = '600 9.5px "JetBrains Mono", monospace';
      ctx.fillStyle = color;
      ctx.fillText(`${label} ${subVal}`, x + 8, y + 3);
      ctx.restore();
    }

    function drawFlightComputerPredictor() {
      if (!interaction || interaction.mode === 'dragStar') return;

      const { startX, startY, vx, vy, r, mass, palette, hasRing, targetPlanet } = interaction;

      // Run 1:1 deterministic integrator forward in time
      const simStars = stars.map(s => ({ ...s, held: false }));
      const simPlanets = planets
        .filter(p => p !== targetPlanet)
        .map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, r: p.r, mass: p.mass, held: false, ax: 0, ay: 0 }));

      const testBody = {
        x: startX, y: startY, vx, vy, r, mass, held: false, ax: 0, ay: 0
      };
      simPlanets.push(testBody);

      const telemetry = classifyConicSection(startX, startY, vx, vy, mass, targetPlanet);
      let statusText = `${telemetry.conic} // e = ${telemetry.ecc.toFixed(3)} // v = ${telemetry.vMag.toFixed(2)}`;
      let pathColor = telemetry.color;

      const totalSteps = labConfig.deepPredict ? 1850 : 620;
      const path = [{ x: startX, y: startY }];

      // Track first Periapsis (PE) and Apoapsis (AP) nodes along the trajectory
      let peNode = null, apNode = null;
      let prevR = null, prevWasDecreasing = null;
      let impactPoint = null;

      for (let step = 0; step < totalSteps; step++) {
        advanceStarsAndPlanetsOneSubstep(simStars, simPlanets, H_STEP);

        // Compute distance to primary barycenter for PE / AP node detection
        let bx = simStars[0].x, by = simStars[0].y;
        if (simStars.length === 2) {
          bx = 0.5 * (simStars[0].x + simStars[1].x);
          by = 0.5 * (simStars[0].y + simStars[1].y);
        }
        const curR = Math.hypot(testBody.x - bx, testBody.y - by);

        if (prevR !== null && step > 6) {
          const isDecreasing = curR < prevR;
          if (prevWasDecreasing === true && !isDecreasing && !peNode) {
            peNode = { x: testBody.x, y: testBody.y, au: (curR / AU_PIXELS).toFixed(2) };
          } else if (prevWasDecreasing === false && isDecreasing && !apNode) {
            apNode = { x: testBody.x, y: testBody.y, au: (curR / AU_PIXELS).toFixed(2) };
          }
          prevWasDecreasing = isDecreasing;
        } else if (prevR !== null) {
          prevWasDecreasing = curR < prevR;
        }
        prevR = curR;

        // Check Physical Surface Impact with Star
        let hit = false;
        for (let sIdx = 0; sIdx < simStars.length; sIdx++) {
          const s = simStars[sIdx];
          if (Math.hypot(s.x - testBody.x, s.y - testBody.y) < s.r + r * 0.45) {
            statusText = `IMPACT TRAJECTORY (${s.name}) // e = ${telemetry.ecc.toFixed(2)}`;
            pathColor = '#ff3366';
            impactPoint = { x: testBody.x, y: testBody.y };
            hit = true;
            break;
          }
        }
        if (hit) {
          path.push({ x: testBody.x, y: testBody.y });
          break;
        }

        // Check Physical Merger with Planet
        for (let pIdx = 0; pIdx < simPlanets.length - 1; pIdx++) {
          const sp = simPlanets[pIdx];
          if (Math.hypot(sp.x - testBody.x, sp.y - testBody.y) < (sp.r + r) * 0.78) {
            statusText = `ORBITAL INTERCEPT / MERGER // e = ${telemetry.ecc.toFixed(2)}`;
            pathColor = '#ffaa00';
            impactPoint = { x: testBody.x, y: testBody.y };
            hit = true;
            break;
          }
        }
        if (hit) {
          path.push({ x: testBody.x, y: testBody.y });
          break;
        }

        if (step % 3 === 0) {
          path.push({ x: testBody.x, y: testBody.y });
        }
        if (testBody.x < -W * 0.6 || testBody.x > W * 1.6 || testBody.y < -H * 0.6 || testBody.y > H * 1.6) {
          break;
        }
      }

      document.getElementById('telemetryBar').innerHTML = `<strong>${statusText}</strong>`;

      ctx.save();
      // 1. Draw Predicted Trajectory Curve
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        if (i === 0) ctx.moveTo(path[i].x, path[i].y);
        else ctx.lineTo(path[i].x, path[i].y);
      }
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = pathColor;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. Draw PE (Periapsis) & AP (Apoapsis) Telemetry Nodes
      if (peNode && !impactPoint) {
        drawMarkerNode(peNode.x, peNode.y, 'PE', `${peNode.au}AU`, '#00f59b');
      }
      if (apNode && telemetry.ecc < 1.0 && !impactPoint) {
        drawMarkerNode(apNode.x, apNode.y, 'AP', `${apNode.au}AU`, '#00e5ff');
      }
      if (impactPoint) {
        drawMarkerNode(impactPoint.x, impactPoint.y, 'IMPACT', '', '#ff3366');
      }

      // 3. Draw Velocity Vector Line & Technical Reticle
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(interaction.curX, interaction.curY);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      if (interaction.mode === 'slingNew') {
        drawVolumetricPlanet({ x: startX, y: startY, r, palette, hasRing });
      }

      // 4. Live Cursor HUD Readout next to finger/mouse
      const hudX = interaction.curX + 14;
      const hudY = interaction.curY - 10;
      ctx.font = '600 10px "JetBrains Mono", monospace';
      ctx.fillStyle = pathColor;
      ctx.fillText(`${telemetry.conic}`, hudX, hudY);
      ctx.fillStyle = '#9fb0cc';
      ctx.fillText(`v:${telemetry.vMag.toFixed(2)}  e:${telemetry.ecc.toFixed(2)}`, hudX, hudY + 13);

      ctx.restore();
    }

    /* 6. POINTER INTERACTION: GRAB STARS, RE-SLING PLANETS, OR INJECT NEW */
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (W / rect.width),
        y: (e.clientY - rect.top) * (H / rect.height)
      };
    }

    const VEL_SCALE = 0.068;

    canvas.addEventListener('pointerdown', e => {
      unlockLab();
      canvas.setPointerCapture(e.pointerId);
      const pt = getCanvasCoords(e);

      // 1. Check if user grabbed a Star or Singularity
      for (const s of stars) {
        if (Math.hypot(pt.x - s.x, pt.y - s.y) <= s.r + 16) {
          s.held = true;
          interaction = {
            pointerId: e.pointerId,
            mode: 'dragStar',
            star: s
          };
          document.getElementById('telemetryBar').innerHTML =
            `<strong>REPOSITIONING PRIMARY ATTRACTOR (${s.name})</strong> // BARYCENTER SHIFT ACTIVE`;
          return;
        }
      }

      // 2. Check if user grabbed an existing Planet, Moon, or Gas Giant
      for (let i = planets.length - 1; i >= 0; i--) {
        const p = planets[i];
        if (Math.hypot(pt.x - p.x, pt.y - p.y) <= p.r + 16) {
          p.held = true;
          p.trail = [];
          interaction = {
            pointerId: e.pointerId,
            mode: 'slingExisting',
            targetPlanet: p,
            startX: p.x,
            startY: p.y,
            curX: p.x + p.vx / VEL_SCALE,
            curY: p.y + p.vy / VEL_SCALE,
            vx: p.vx,
            vy: p.vy,
            r: p.r,
            mass: p.mass,
            palette: p.palette,
            hasRing: p.hasRing
          };
          return;
        }
      }

      // 3. Otherwise, inject & aim a new payload of the selected Mass Class
      const minDim = Math.min(W, H);
      const sizeScale = Math.max(0.78, Math.min(1.05, minDim / 520));
      const spec = massClasses[labConfig.launchClass];
      const pal = celestialPalettes[Math.floor(Math.random() * celestialPalettes.length)];
      interaction = {
        pointerId: e.pointerId,
        mode: 'slingNew',
        targetPlanet: null,
        startX: pt.x,
        startY: pt.y,
        curX: pt.x,
        curY: pt.y,
        vx: 0,
        vy: 0,
        r: spec.r * sizeScale,
        mass: spec.mass,
        palette: pal,
        hasRing: spec.hasRing
      };
    });

    canvas.addEventListener('pointermove', e => {
      if (!interaction || e.pointerId !== interaction.pointerId) return;
      const pt = getCanvasCoords(e);

      if (interaction.mode === 'dragStar') {
        const s = interaction.star;
        s.vx = (pt.x - s.x) * 0.25;
        s.vy = (pt.y - s.y) * 0.25;
        s.x = pt.x;
        s.y = pt.y;
      } else {
        interaction.curX = pt.x;
        interaction.curY = pt.y;
        interaction.vx = (pt.x - interaction.startX) * VEL_SCALE;
        interaction.vy = (pt.y - interaction.startY) * VEL_SCALE;
      }
    });

    function finishInteraction(e) {
      if (!interaction || e.pointerId !== interaction.pointerId) return;

      if (interaction.mode === 'dragStar') {
        interaction.star.held = false;
        if (stars.length === 1) {
          interaction.star.vx = 0;
          interaction.star.vy = 0;
        }
      } else if (interaction.mode === 'slingExisting') {
        const p = interaction.targetPlanet;
        p.vx = interaction.vx;
        p.vy = interaction.vy;
        p.held = false;
        sfx.playInject();
      } else if (interaction.mode === 'slingNew') {
        spawnBody(
          interaction.startX,
          interaction.startY,
          interaction.vx,
          interaction.vy,
          interaction.r,
          interaction.mass,
          interaction.palette,
          interaction.hasRing
        );
        sfx.playInject();
      }

      interaction = null;
      document.getElementById('telemetryBar').innerHTML =
        '<strong>INTERACTIVE TELEMETRY</strong> // DRAG EMPTY SPACE TO INJECT ORBIT • GRAB ANY BODY TO REDIRECT';
    }

    canvas.addEventListener('pointerup', finishInteraction);
    canvas.addEventListener('pointercancel', finishInteraction);

    /* 7. RESIZE, UI BINDINGS & MAIN LOOP */
    function resizeCanvas() {
      const rect = document.getElementById('canvasFrame').getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const newW = Math.max(260, Math.floor(rect.width));
      const newH = Math.max(260, Math.floor(rect.height));
      if (Math.abs(newW - W) < 4 && Math.abs(newH - H) < 4 && stars.length > 0) return;

      W = newW;
      H = newH;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createBackgroundStars();
      initSystem();
    }

    const resizeObserver = new ResizeObserver(() => resizeCanvas());
    resizeObserver.observe(document.getElementById('canvasFrame'));

    document.getElementById('soundBtn').addEventListener('click', e => {
      sfx.init();
      sfx.enabled = !sfx.enabled;
      e.target.classList.toggle('active', sfx.enabled);
      e.target.textContent = sfx.enabled ? 'AUDIO: ON' : 'AUDIO: OFF';
    });

    // Mass Class Selector
    document.querySelectorAll('#massSelectGroup .pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#massSelectGroup .pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        labConfig.launchClass = btn.dataset.mass;
      });
    });

    // Dynamic "ALL MODES ON" <-> "DEFAULT" Button
    const allTogglesBtn = document.getElementById('allTogglesBtn');

    function areAllTogglesOn() {
      return labConfig.deepPredict && labConfig.slowMoAim && labConfig.longTrails;
    }

    function syncAllTogglesButton() {
      const allOn = areAllTogglesOn();
      allTogglesBtn.textContent = allOn ? 'DEFAULT MODES' : 'ALL MODES ON';
      allTogglesBtn.classList.toggle('all-on', allOn);
    }

    document.getElementById('toggleDeepPredict').addEventListener('change', e => {
      labConfig.deepPredict = e.target.checked;
      syncAllTogglesButton();
    });
    document.getElementById('toggleSlowMo').addEventListener('change', e => {
      labConfig.slowMoAim = e.target.checked;
      syncAllTogglesButton();
    });
    document.getElementById('toggleLongTrails').addEventListener('change', e => {
      labConfig.longTrails = e.target.checked;
      if (!labConfig.longTrails) {
        planets.forEach(p => { if (p.trail.length > 65) p.trail.splice(0, p.trail.length - 65); });
      }
      syncAllTogglesButton();
    });

    allTogglesBtn.addEventListener('click', () => {
      if (areAllTogglesOn()) {
        labConfig.deepPredict = true;
        labConfig.slowMoAim = true;
        labConfig.longTrails = false;
      } else {
        labConfig.deepPredict = true;
        labConfig.slowMoAim = true;
        labConfig.longTrails = true;
      }
      document.getElementById('toggleDeepPredict').checked = labConfig.deepPredict;
      document.getElementById('toggleSlowMo').checked = labConfig.slowMoAim;
      document.getElementById('toggleLongTrails').checked = labConfig.longTrails;
      syncAllTogglesButton();
      unlockLab();
    });

    // 3 Gravitational Regimes
    document.querySelectorAll('#systemPresetGroup .pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#systemPresetGroup .pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        labConfig.system = btn.dataset.system;
        unlockLab();
        initSystem();
      });
    });

    document.getElementById('resetSystemBtn').addEventListener('click', () => {
      unlockLab();
      initSystem();
    });

    let lastFrameTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const elapsed = now - lastFrameTime;
      lastFrameTime = now;
      const dt = Math.min(2.0, Math.max(0.5, elapsed / 16.667));

      ctx.save();
      ctx.fillStyle = '#020408';
      ctx.fillRect(0, 0, W, H);

      if (shake > 0.15) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= Math.pow(0.84, dt);
      } else {
        shake = 0;
      }

      // Deep Space Reference Stars
      ctx.fillStyle = '#ffffff';
      for (const st of bgStars) {
        ctx.globalAlpha = st.alpha;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      drawPolarAstrometryGrid();
      stepPhysics(dt);
      drawTrailsAndDebris();

      for (const s of stars) drawStar(s, now);
      for (const p of planets) drawVolumetricPlanet(p);

      drawFlightComputerPredictor();
      ctx.restore();
    }

    syncAllTogglesButton();
    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
